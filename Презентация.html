function ActivityLogger({ onClose, onSave, baseline, editingEntry, dishes }) {
  const [tab, setTab] = useState(editingEntry ? editingEntry.type : 'food');
  const [foodStep, setFoodStep] = useState(editingEntry?.type === 'food' ? 'edit' : 'pick');
  const [form, setForm] = useState(() => {
    const base = {
      food: { name:'', calories:0, protein:0, fat:0, carbs:0 },
      workout: { subtype:'strength', duration:60, calories:400 },
      sleep: { hours:8, quality:4 },
      other: { subtype:'walk', duration:30 }
    };
    if (!editingEntry) return base;
    if (editingEntry.type==='food') base.food = { name:editingEntry.name||'', calories:editingEntry.calories ?? 0, protein:editingEntry.protein ?? 0, fat:editingEntry.fat ?? 0, carbs:editingEntry.carbs ?? 0 };
    else if (editingEntry.type==='workout') base.workout = { subtype:editingEntry.subtype||'strength', duration:editingEntry.duration ?? 60, calories:editingEntry.calories ?? 0 };
    else if (editingEntry.type==='sleep') base.sleep = { hours:editingEntry.hours ?? 8, quality:editingEntry.quality ?? 4 };
    else if (editingEntry.type==='other') base.other = { subtype:editingEntry.subtype||'walk', duration:editingEntry.duration ?? 30 };
    return base;
  });
  const tabs = [{id:'food',label:'🍽 Еда'},{id:'workout',label:'🏋️ Тренировка'},{id:'sleep',label:'😴 Сон'},{id:'other',label:'🚶 Прочее'}];
  const isSport = ['volleyball','padel','tennis','football','basketball'].includes(form.workout.subtype);

  const updateWorkout = (field, value) => {
    setForm(prev => {
      const w = { ...prev.workout, [field]: value };
      if (field==='subtype'||field==='duration') {
        if (['volleyball','padel','tennis','football','basketball'].includes(w.subtype) && w.duration) {
          w.calories = calcMETCalories(MET_COEFFICIENTS[w.subtype], baseline.weight, +w.duration);
        }
      }
      return { ...prev, workout: w };
    });
  };
  const update = (s, f, v) => setForm(prev => ({ ...prev, [s]: { ...prev[s], [f]: v } }));

  const selectDish = (d) => {
    setForm(prev => ({ ...prev, food: {
      name: d.name,
      calories: d.calories,
      protein: d.protein,
      fat: d.fat,
      carbs: d.carbs
    }}));
    setFoodStep('edit');
  };

  const startNewDish = () => {
    setForm(prev => ({ ...prev, food: { name:'', calories:0, protein:0, fat:0, carbs:0 } }));
    setFoodStep('edit');
  };

  const handleSubmit = () => {
    const raw = form[tab];
    const normalized = { ...raw };
    Object.keys(normalized).forEach(k => {
      if (typeof normalized[k] === 'string' && normalized[k] !== '') {
        const n = parseFloat(normalized[k].replace(',', '.'));
        normalized[k] = Number.isNaN(n) ? 0 : n;
      } else if (normalized[k] === '') {
        normalized[k] = 0;
      }
    });
    onSave({ ...normalized, type: tab, timestamp: editingEntry ? editingEntry.timestamp : Date.now() });
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <div className="modal-title">
            {editingEntry?'Редактирование':'Добавить активность'}
            {editingEntry && <span className="badge">edit</span>}
          </div>
          <button className="close-btn" onClick={onClose}>×</button>
        </div>
        <div className="logger-tabs">
          {tabs.map(t => (
            <button key={t.id} className={`logger-tab ${tab===t.id?'active':''}`}
              onClick={()=>setTab(t.id)}>{t.label}</button>
          ))}
        </div>
        <div className="modal-body">
          {/* FOOD — pick step */}
          {tab==='food' && foodStep==='pick' && (
            <div>
              <div style={{ fontSize: 13, color: 'var(--muted)', marginBottom: 12 }}>
                {(dishes && dishes.length > 0) ? 'Выбери блюдо из каталога' : 'Каталог пуст — добавь первое блюдо'}
              </div>
              {dishes && dishes.length > 0 && (
                <div className="dish-picker-list">
                  {dishes.map(d => (
                    <button key={d.id} className="dish-pick-item" onClick={() => selectDish(d)}>
                      <div className="dish-pick-name">{d.name}</div>
                      <div className="dish-pick-macros">
                        {Math.round(d.calories || 0)} ккал · Б {(+d.protein||0).toFixed(0)} · Ж {(+d.fat||0).toFixed(0)} · У {(+d.carbs||0).toFixed(0)}
                      </div>
                    </button>
                  ))}
                </div>
              )}
              <button className="btn secondary" onClick={startNewDish}>+ Новое блюдо</button>
            </div>
          )}

          {/* FOOD — edit step */}
          {tab==='food' && foodStep==='edit' && (
            <div>
              {form.food.name && (
                <button className="btn secondary"
                  onClick={() => setFoodStep('pick')}
                  style={{ marginBottom: 12, padding: '8px 14px', width: 'auto', fontSize: 13 }}>
                  ← Изменить блюдо
                </button>
              )}
              <div className="form-grid">
                <div className="field full"><label>Название</label>
                  <input value={form.food.name} onChange={e=>update('food','name',e.target.value)} placeholder="Куриная грудка с рисом" autoFocus /></div>
                <div className="field"><label>Калории</label>
                  <NumberInput value={form.food.calories} onChange={v=>update('food','calories',v)} /></div>
                <div className="field"><label>Белки (г)</label>
                  <NumberInput value={form.food.protein} onChange={v=>update('food','protein',v)} /></div>
                <div className="field"><label>Жиры (г)</label>
                  <NumberInput value={form.food.fat} onChange={v=>update('food','fat',v)} /></div>
                <div className="field"><label>Углеводы (г)</label>
                  <NumberInput value={form.food.carbs} onChange={v=>update('food','carbs',v)} /></div>

              {form.food.name && !(dishes || []).find(d => d.name.toLowerCase() === form.food.name.trim().toLowerCase()) && (

          {tab==='workout' && (
            <div className="form-grid">
              <div className="field full"><label>Тип тренировки</label>
                <select value={form.workout.subtype} onChange={e=>updateWorkout('subtype',e.target.value)}>
                  <option value="strength">Силовая</option><option value="cardio">Кардио</option>
                  <option value="volleyball">Волейбол (MET 4.0)</option>
                  <option value="padel">Падел (MET 6.0)</option>
                  <option value="tennis">Теннис (MET 7.0)</option>
                  <option value="football">Футбол (MET 7.0)</option>
                  <option value="basketball">Баскетбол (MET 6.5)</option>
                </select></div>
              <div className="field full"><label>Длительность (мин)</label>
                <NumberInput value={form.workout.duration} onChange={v=>updateWorkout('duration',v)} /></div>
              <div className="field full"><label>Калории {isSport?'· авто по МЕТ':'· из трекера'}</label>
                <NumberInput value={form.workout.calories} onChange={v=>update('workout','calories',v)} /></div>
            </div>
          )}
          {tab==='sleep' && (
            <div className="form-grid">
              <div className="field full"><label>Длительность (часы)</label>
                <NumberInput value={form.sleep.hours} onChange={v=>update('sleep','hours',v)} /></div>
              <div className="field full"><label>Качество (1-5)</label>
                <NumberInput value={form.sleep.quality} onChange={v=>update('sleep','quality',v)} /></div>
            </div>
          )}
          {tab==='other' && (
            <div className="form-grid">
              <div className="field full"><label>Тип</label>
                <select value={form.other.subtype} onChange={e=>update('other','subtype',e.target.value)}>
                  <option value="walk">Прогулка</option>
                  <option value="work_sit">Работа сидячая</option>
                  <option value="work_stand">Работа стоячая</option>
                  <option value="chill">Спокойствие</option>
                </select></div>
              <div className="field full"><label>Длительность (мин)</label>
                <NumberInput value={form.other.duration} onChange={v=>update('other','duration',v)} /></div>
            </div>
          )}
          {!(tab==='food' && foodStep==='pick') && (
            <button className="btn" style={{ marginTop: 24 }} onClick={handleSubmit}>
              {editingEntry?'Сохранить изменения':'Сохранить'}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function InBodyEditor({ entry, baseline, onSave, onClose }) {
  const isEdit = !!entry?.id;
  const autoBmi = (w, h) => w > 0 && h > 0 ? +(w / Math.pow(h/100, 2)).toFixed(1) : 0;
  const [form, setForm] = useState(() => {
    if (entry) {
      const d = new Date(entry.date);
      const local = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      return { ...entry, date: local };
    }
    return {
      date: new Date().toISOString().slice(0, 10),
      weight: baseline?.weight || 0,
      fatPercent: baseline?.fatPercent || 0,
      musclePercent: baseline?.musclePercent || 0,
      bmr: baseline?.bmr || calculateBMR(baseline?.weight, baseline?.height, baseline?.age, baseline?.gender),
      bmi: baseline?.bmi || autoBmi(baseline?.weight, baseline?.height)
    };
  });
  const [err, setErr] = useState('');
  const update = (f, v) => setForm(prev => ({ ...prev, [f]: v }));

  const setWeight = (v) => {
    setForm(prev => ({
      ...prev,
      weight: v,
      bmi: (v > 0 && baseline?.height) ? autoBmi(+v, baseline.height) : prev.bmi
    }));
  };

  const handleSubmit = () => {
    if (!form.weight || !form.fatPercent) { setErr('Заполните вес и % жира'); return; }
    setErr('');
    const d = new Date(form.date + 'T12:00:00');
    onSave({
      id: entry?.id || genId(),
      date: d.toISOString(),
      weight: +form.weight,
      fatPercent: +form.fatPercent,
      musclePercent: +form.musclePercent,
      bmr: +form.bmr,
      bmi: +form.bmi
    });
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-header">
          <div className="modal-title">{isEdit ? 'Редактировать замер' : 'Новый замер InBody'}</div>
          <button className="close-btn" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div className="form-grid">
            <div className="field full">
              <label>Дата</label>
              <input type="date" value={form.date} onChange={e => update('date', e.target.value)} />
            </div>
            <div className="field"><label>Вес (кг)</label>
              <NumberInput value={form.weight} onChange={setWeight} /></div>
            <div className="field"><label>% жира</label>
              <NumberInput value={form.fatPercent} onChange={v => update('fatPercent', v)} /></div>
            <div className="field"><label>% мышц</label>
              <NumberInput value={form.musclePercent} onChange={v => update('musclePercent', v)} /></div>
            <div className="field"><label>BMR (ккал)</label>
              <NumberInput value={form.bmr} onChange={v => update('bmr', v)} /></div>
            <div className="field full"><label>ИМТ</label>
              <NumberInput value={form.bmi} onChange={v => update('bmi', v)} /></div>
          </div>
          {err && <div className="auth-error" style={{ marginBottom: 16 }}>⚠ {err}</div>}
          <button className="btn" style={{ marginTop: 8 }} onClick={handleSubmit}>
            {isEdit ? 'Сохранить' : 'Добавить замер'}
          </button>
        </div>
      </div>
    </div>
  );
}

function InBodyValue({ label, value, delta, unit, color, decimals = 1 }) {
  let deltaEl = null;
  if (delta != null && Math.abs(delta) > 0.001) {
    const sign = delta > 0 ? '+' : '−';
    const abs = Math.abs(delta).toFixed(decimals);
    let cls = 'delta-neutral';
    if (color === 'normal') cls = delta > 0 ? 'delta-good' : 'delta-bad';
    else if (color === 'inverse') cls = delta < 0 ? 'delta-good' : 'delta-bad';
    deltaEl = <span className={`delta-badge ${cls}`}>{sign}{abs}{unit}</span>;
  }
  return (
    <div className="inbody-value-box">
      <div className="inbody-value-label">{label}</div>
      <div className="inbody-value-main">
        <span className="inbody-value-number">{value}</span>
        {deltaEl}
      </div>
    </div>
  );
}

                    </div>
                  </div>
                  <div className="entry-actions">
                    <button onClick={() => onEdit(log)} title="Редактировать">✎</button>
                    <button className="danger" onClick={() => onDelete(log)} title="Удалить">×</button>
                  </div>
                </div>
                <div className="inbody-values">
                  <InBodyValue label="Вес" value={`${(log.weight || 0).toFixed(1)} кг`}
                    delta={log.prev ? log.weight - log.prev.weight : null}
                    unit=" кг" color="neutral" decimals={1} />
                  <InBodyValue label="% жира" value={`${(log.fatPercent || 0).toFixed(1)}%`}
                    delta={log.prev ? log.fatPercent - log.prev.fatPercent : null}
                    unit="%" color="inverse" decimals={1} />
                  <InBodyValue label="% мышц" value={`${(log.musclePercent || 0).toFixed(1)}%`}
                    delta={log.prev ? log.musclePercent - log.prev.musclePercent : null}
                    unit="%" color="normal" decimals={1} />
                  <InBodyValue label="BMR" value={`${Math.round(log.bmr || 0)} ккал`}
                    delta={log.prev ? log.bmr - log.prev.bmr : null}
                    unit=" ккал" color="normal" decimals={0} />
                  <InBodyValue label="ИМТ" value={log.bmi != null ? log.bmi.toFixed(1) : '—'}
                    delta={log.prev && log.prev.bmi && log.bmi ? log.bmi - log.prev.bmi : null}
                    unit="" color="neutral" decimals={1} />
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );

function LineChart({ data, color='#8b5cf6', height=200, id, goalLine, planData }) {
  const width = 600, pad = { top:15, right:20, bottom:30, left:45 };
  const innerW = width-pad.left-pad.right, innerH = height-pad.top-pad.bottom;
  if (data.length < 2) return <div className="empty-state" style={{ padding:30 }}>Недостаточно данных</div>;
  const planValues = planData ? planData.filter(v => v != null && !isNaN(v)) : [];
  const all = [...data.map(d=>d.value), ...(goalLine!=null?[goalLine]:[]), ...planValues];
  const minV = Math.min(...all), maxV = Math.max(...all);
  const range = (maxV-minV)||1, minY = minV-range*0.15, maxY = maxV+range*0.15;
  const points = data.map((d,i) => ({
    x: pad.left + (i/(data.length-1))*innerW,
    y: pad.top + (1-(d.value-minY)/(maxY-minY))*innerH, ...d
  }));
  const pathD = points.map((p,i)=>(i===0?'M':'L')+` ${p.x} ${p.y}`).join(' ');
  const areaD = pathD + ` L ${points[points.length-1].x} ${pad.top+innerH} L ${pad.left} ${pad.top+innerH} Z`;
  const goalY = goalLine!=null ? pad.top+(1-(goalLine-minY)/(maxY-minY))*innerH : null;
  let planPathD = null;
  if (planData && planValues.length >= 2) {
    const pts = [];
    planData.forEach((val, i) => {
      if (val == null || isNaN(val)) return;
      pts.push({
        x: pad.left + (i / (data.length - 1)) * innerW,
        y: pad.top + (1 - (val - minY) / (maxY - minY)) * innerH
      });
    });
    if (pts.length >= 2) {
      planPathD = pts.map((p, i) => (i === 0 ? 'M' : 'L') + ` ${p.x} ${p.y}`).join(' ');
    }
  }
  const zeroY = minY < 0 && maxY > 0 ? pad.top + (1 - (0 - minY) / (maxY - minY)) * innerH : null;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="line-chart">
      <defs><linearGradient id={`grad-${id}`} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={color} stopOpacity="0.3" />
        <stop offset="100%" stopColor={color} stopOpacity="0" />
      </linearGradient></defs>
      {[0,0.25,0.5,0.75,1].map(t => {
        const y = pad.top+t*innerH, val = maxY-t*(maxY-minY);
        return (<g key={t}>
          <line className="chart-grid" x1={pad.left} y1={y} x2={width-pad.right} y2={y} />
          <text className="chart-axis-label" x={pad.left-8} y={y+3} textAnchor="end">{val.toFixed(1)}</text>
        </g>);
      })}
      {zeroY != null && (
        <line x1={pad.left} y1={zeroY} x2={width-pad.right} y2={zeroY}
          stroke="var(--border)" strokeWidth="1" strokeDasharray="2 3" opacity="0.7" />
      )}
      {goalY!=null && goalY>=pad.top && goalY<=pad.top+innerH && (
        <g>
          <line x1={pad.left} y1={goalY} x2={width-pad.right} y2={goalY}
            stroke="#eab308" strokeWidth="1.5" strokeDasharray="6 4" opacity="0.5" />
          <text x={width-pad.right-4} y={goalY-6} textAnchor="end" fill="#eab308"
            fontSize="10" fontWeight="700" fontFamily="inherit">ЦЕЛЬ {goalLine}</text>
        </g>
      )}
      {planPathD && (
        <path d={planPathD} fill="none" stroke="#eab308" strokeWidth="2"
          strokeDasharray="4 3" strokeLinejoin="round" strokeLinecap="round" opacity="0.9" />
      )}
      <path d={areaD} fill={`url(#grad-${id})`} />
      <path d={pathD} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p,i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="3.5" fill={color} />
          {i % Math.ceil(points.length/7) === 0 && (
            <text className="chart-axis-label" x={p.x} y={height-8} textAnchor="middle">{p.label}</text>
          )}
        </g>
      ))}
    </svg>
  );
}

function ChartsView({ history, goal, baseline, sim, todayData }) {

    return history.slice(-days);
  }, [history, filter]);
  if (history.length < 2) {
    return (

            <button key={f} className={`filter-btn ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>

    date: new Date().toISOString(),

  const gf = goal && goal.targetType==='fatPercent' ? goal.targetValue : null;
  const gm = goal && goal.targetType==='musclePercent' ? goal.targetValue : null;
  const planW = goal ? computePlanSeries(allData, goal, baseline, 'weight') : null;
  const planF = goal ? computePlanSeries(allData, goal, baseline, 'fatPercent') : null;
  const planM = goal ? computePlanSeries(allData, goal, baseline, 'musclePercent') : null;

  const hasLipidData = allData.some(d => d.fatOxidized != null);

  return (
    <div className="journal">
      <div className="journal-filters">

          <button key={f} className={`filter-btn ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>

      <ChartCard title="% жира" subtitle="· динамика" id="f"
        data={allData.map(d=>({ label:fmt(d), value:d.fatPercent }))}
        color="#f97316" goalLine={gf} planData={planF} />
      <ChartCard title="% мышц" subtitle="· динамика" id="m"
        data={allData.map(d=>({ label:fmt(d), value:d.musclePercent }))}
        color="#3b82f6" goalLine={gm} planData={planM} />

      {hasLipidData && (
        <>
          <ChartCard title="🔥 Липолиз" subtitle="· окисление жира, г/день" id="fo"
            data={allData.map(d=>({ label:fmt(d), value: d.fatOxidized || 0 }))}

          <ChartCard title="🔴 Липогенез" subtitle="· отложение жира, г/день" id="fs"

        </>

  useEffect(() => {
    if (!user) return;
    try {
      localStorage.setItem('metabo_data_' + user, JSON.stringify({
        baseline, foodLogs, activities, history, goal, dishes, inbodyLogs
      }));
    } catch (e) { console.error('Persist:', e); }
  }, [user, baseline, foodLogs, activities, history, goal, dishes, inbodyLogs]);

  const showToast = (msg, kind='success') => {
    setToast({ msg, kind });
    setTimeout(() => setToast(null), 2500);
  };

  const handleLogout = () => {
    try { localStorage.removeItem('metabo_session'); } catch (e) {}
    setUser(null); setBaseline(null); setFoodLogs([]); setActivities([]);
    setHistory([]); setGoal(null); setDishes([]); setInbodyLogs([]);
    setTab('map'); setMobileTab('map');
  };

  const handleAuth = (email) => {
    setUser(email);
    try {
      const saved = localStorage.getItem('metabo_data_' + email);
      if (saved) {
        const d = JSON.parse(saved);
        setBaseline(d.baseline || null);
        setFoodLogs(d.foodLogs || []);
        setActivities(d.activities || []);
        setHistory(d.history || []);
        setGoal(d.goal || null);
        setDishes(d.dishes || []);
        let logs = d.inbodyLogs || [];
        if (logs.length === 0 && d.baseline) {
          logs = [{
            id: genId(),
            date: new Date().toISOString(),
            weight: d.baseline.weight,
            fatPercent: d.baseline.fatPercent,
            musclePercent: d.baseline.musclePercent,
            bmr: d.baseline.bmr,
            bmi: d.baseline.bmi || calcBMI(d.baseline.weight, d.baseline.height)
          }];
        }
        setInbodyLogs(logs);
      }
    } catch (e) { console.error('Auth load:', e); }
  };

  const initDemo = (base) => {
    const now = Date.now();
    const day = 86400000;
    setFoodLogs([
      { id: genId(), type:'food', name:'Овсянка с бананом', calories:420, protein:15, fat:8, carbs:70, timestamp: now - 8*3600e3 },
      { id: genId(), type:'food', name:'Куриная грудка + рис', calories:650, protein:55, fat:12, carbs:75, timestamp: now - 4*3600e3 },
      { id: genId(), type:'food', name:'Творог + орехи', calories:380, protein:30, fat:18, carbs:20, timestamp: now - 1.5*3600e3 },
      { id: genId(), type:'food', name:'Лосось + овощи', calories:550, protein:40, fat:25, carbs:15, timestamp: now - 0.5*3600e3 },
      // вчера
      { id: genId(), type:'food', name:'Овсянка с бананом', calories:420, protein:15, fat:8, carbs:70, timestamp: now - 1*day - 8*3600e3 },
      { id: genId(), type:'food', name:'Куриная грудка + рис', calories:650, protein:55, fat:12, carbs:75, timestamp: now - 1*day - 4*3600e3 },
    ]);
    setActivities([
      { id: genId(), type:'workout', subtype:'strength', duration:60, calories:380, timestamp: now - 5*3600e3 },
      { id: genId(), type:'sleep', hours:8, quality:4, timestamp: now - 10*3600e3 },
      { id: genId(), type:'other', subtype:'walk', duration:45, timestamp: now - 3*3600e3 },
      { id: genId(), type:'workout', subtype:'cardio', duration:30, calories:280, timestamp: now - 1*day - 6*3600e3 },
      { id: genId(), type:'sleep', hours:7.5, quality:3, timestamp: now - 1*day - 9*3600e3 },
    ]);
    setDishes([
      { id: genId(), name: 'Овсянка с бананом', calories: 420, protein: 15, fat: 8, carbs: 70 },
      { id: genId(), name: 'Куриная грудка + рис', calories: 650, protein: 55, fat: 12, carbs: 75 },
      { id: genId(), name: 'Творог + орехи', calories: 380, protein: 30, fat: 18, carbs: 20 },
      { id: genId(), name: 'Лосось + овощи', calories: 550, protein: 40, fat: 25, carbs: 15 },
      { id: genId(), name: 'Паста с курицей', calories: 700, protein: 45, fat: 18, carbs: 80 },
      { id: genId(), name: 'Салат с тунцом', calories: 380, protein: 35, fat: 15, carbs: 20 },
    ]);
    // 6 замеров InBody
    setInbodyLogs([
      { id: genId(), date: new Date(now - 70*day).toISOString(), weight: 80.0, fatPercent: 20.0, musclePercent: 40.0, bmr: 1750, bmi: 25.2 },
      { id: genId(), date: new Date(now - 56*day).toISOString(), weight: 79.6, fatPercent: 19.4, musclePercent: 40.4, bmr: 1758, bmi: 25.1 },
      { id: genId(), date: new Date(now - 42*day).toISOString(), weight: 79.2, fatPercent: 18.8, musclePercent: 40.9, bmr: 1766, bmi: 25.0 },
      { id: genId(), date: new Date(now - 28*day).toISOString(), weight: 78.8, fatPercent: 18.4, musclePercent: 41.3, bmr: 1772, bmi: 24.8 },
      { id: genId(), date: new Date(now - 14*day).toISOString(), weight: 78.4, fatPercent: 18.2, musclePercent: 41.7, bmr: 1776, bmi: 24.7 },
      { id: genId(), date: new Date(now).toISOString(), weight: 78.0, fatPercent: 18.0, musclePercent: 42.0, bmr: 1780, bmi: 24.6 },
    ]);
    const hist = [];
    let w = base.weight+1.2, f = base.fatPercent+0.6, m = base.musclePercent-0.8;
    for (let i=13; i>=0; i--) {
      const d = new Date(); d.setDate(d.getDate()-i);
      const deficit = (Math.random() - 0.5) * 700;
      const fatOx = 40 + Math.random() * 40 + (deficit < 0 ? Math.abs(deficit) / 30 : 0);
      const fatSt = 25 + Math.random() * 30 + (deficit > 0 ? deficit / 30 : 0);
      hist.push({
        date: d.toISOString(), weight: w, fatPercent: f, musclePercent: m,
        caloriesConsumed: 1900 + Math.round(Math.random()*600),
        balance: Math.round(deficit),
        fatOxidized: fatOx,
        fatStored: fatSt,
        muscleNet: 3 + Math.random() * 10
      });
      w -= 0.09 + Math.random()*0.04;
      f -= 0.04 + Math.random()*0.02;
      m += 0.03 + Math.random()*0.02;
    }
    setHistory(hist);
  };

  const handleDemo = () => {
    const demoEmail = 'demo@metabo.app';
    const demoBaseline = {
      name: 'Демо', age: 30, gender: 'male', height: 178, weight: 78,
      fatPercent: 18, musclePercent: 42, activityLevel: 'moderate',
      bmr: calculateBMR(78, 178, 30, 'male')
    };
    try { localStorage.setItem('metabo_session', demoEmail); } catch (e) {}
    setUser(demoEmail);
    setBaseline(demoBaseline);
    initDemo(demoBaseline);
  };

  const handleOnboard = (data) => {
    const cleaned = {
      ...data,
      weight: +data.weight || 0,
      height: +data.height || 0,
      age: +data.age || 0,
      fatPercent: +data.fatPercent || 0,
      musclePercent: +data.musclePercent || 0
    };
    setBaseline(cleaned);
    if (data.demo) {
      initDemo(cleaned);
    } else {
      // create initial InBody log
      const today = new Date().toISOString().slice(0, 10);
      const existing = inbodyLogs.find(l => l.date.slice(0, 10) === today);
      const newEntry = {
        id: existing?.id || genId(),
        date: new Date().toISOString(),
        weight: cleaned.weight,
        fatPercent: cleaned.fatPercent,
        musclePercent: cleaned.musclePercent,
        bmr: cleaned.bmr,
        bmi: calcBMI(cleaned.weight, cleaned.height)
      };
      if (existing) {
        setInbodyLogs(prev => prev.map(l => l.id === existing.id ? newEntry : l));
      } else {
        setInbodyLogs(prev => [...prev, newEntry]);
      }
    }
    setEditingBaseline(false);
  };

  // Сегодняшние данные
  const todayData = useMemo(() => {
    if (!baseline) return null;
    const now = new Date();
    const dayStart = new Date(now); dayStart.setHours(0,0,0,0);
    const dayStartTs = dayStart.getTime();
    const dayEndTs = dayStartTs + 24 * 3600e3;

    const todayFoods = foodLogs.filter(f => f.timestamp >= dayStartTs && f.timestamp < dayEndTs);
    const todayActs = activities.filter(a => a.timestamp >= dayStartTs && a.timestamp < dayEndTs);

    const macros = todayFoods.reduce((acc, f) => ({
      protein: acc.protein + (+f.protein || 0),
      fat: acc.fat + (+f.fat || 0),
      carbs: acc.carbs + (+f.carbs || 0)
    }), { protein:0, fat:0, carbs:0 });
    const calC = todayFoods.reduce((s,f)=>s+(+f.calories || 0), 0);
    const wCal = todayActs.filter(a=>a.type==='workout').reduce((s,a)=>s+(+a.calories || 0), 0);

    const sleepH = activities.filter(a => {
      if (a.type !== 'sleep') return false;
      const start = a.timestamp;
      const end = start + (+a.hours || 0) * 3600e3;
      return end > dayStartTs && start < dayEndTs;
    }).reduce((s, a) => s + (+a.hours || 0), 0) || 8;

    const hasStr = todayActs.some(a=>a.type==='workout'&&a.subtype==='strength');
    const bmr = baseline.bmr || calculateBMR(baseline.weight, baseline.height, baseline.age, baseline.gender);
    const tdee = calculateTDEE(bmr, baseline.activityLevel, wCal, macros);
    const balance = calC - tdee;
    return { tdee, caloriesConsumed: calC, balance, macros, sleepHours: sleepH, hasStrength: hasStr };
  }, [baseline, foodLogs, activities]);

  const sim = useMemo(() => {
    if (!todayData) return null;
    return simulateDay(foodLogs, activities, todayData.balance);
  }, [foodLogs, activities, todayData?.balance, tick]);

  const plan = useMemo(() => computePlan(goal, baseline), [goal, baseline]);

  const openLoggerNew = () => { setEditingEntry(null); setLoggerOpen(true); };
  const openLoggerEdit = (entry) => { setEditingEntry(entry); setLoggerOpen(true); };
  const closeLogger = () => { setLoggerOpen(false); setEditingEntry(null); };

  const handleSave = (entry) => {
    if (editingEntry) {
      setFoodLogs(prev => prev.filter(f=>f.id!==editingEntry.id));
      setActivities(prev => prev.filter(a=>a.id!==editingEntry.id));
      const upd = { ...entry, id: editingEntry.id };
      if (upd.type==='food') setFoodLogs(prev => [...prev, upd]);
      else setActivities(prev => [...prev, upd]);
      showToast('✓ Изменения сохранены');
    } else {
      const ne = { ...entry, id: genId() };
      if (ne.type==='food') {
        setFoodLogs(prev => [...prev, ne]);
        showToast(`✓ ${ne.name || 'Приём пищи'} · ${ne.calories || 0} ккал`);
        // sync to dishes only for new names
        if (ne.name && ne.name.trim()) {
          const trimmed = ne.name.trim();
          setDishes(prev => {
            const exists = prev.find(d => d.name.toLowerCase() === trimmed.toLowerCase());
            if (exists) return prev;
            return [...prev, {
              id: genId(), name: trimmed,
              calories: +ne.calories || 0,
              protein: +ne.protein || 0,
              fat: +ne.fat || 0,
              carbs: +ne.carbs || 0
            }];
          });
        }
      } else {
        setActivities(prev => [...prev, ne]);
        showToast(`✓ ${ne.type==='workout'?'Тренировка':ne.type==='sleep'?'Сон':'Активность'}`);
      }
    }
    closeLogger();
  };

  const handleDelete = (entry) => {
    if (entry.type==='food') setFoodLogs(prev=>prev.filter(f=>f.id!==entry.id));
    else setActivities(prev=>prev.filter(a=>a.id!==entry.id));
    showToast(`Удалено: ${entryLabel(entry)}`, 'danger');
  };

  const handleSetGoal = (g) => {
    setGoal(g);
    showToast(`🎯 Цель: ${g.targetValue}${g.assessment?.targetUnit || ''}`, 'goal');
  };

  // Рацион
  const openDishEditor = (dish) => {
    setDishEditorDish(dish);
    setDishEditorOpen(true);
  };
  const closeDishEditor = () => {
    setDishEditorOpen(false);
    setDishEditorDish(null);
  };
  const handleSaveDish = (dish) => {
    if (dish.id) {
      setDishes(prev => prev.map(d => d.id === dish.id ? dish : d));
      showToast(`✓ Обновлено: ${dish.name}`);
    } else {
      setDishes(prev => [...prev, { ...dish, id: genId() }]);
      showToast(`✓ Добавлено: ${dish.name}`);
    }
    closeDishEditor();
  };
  const handleDeleteDish = (dish) => {
    setDishes(prev => prev.filter(d => d.id !== dish.id));
    showToast(`Удалено: ${dish.name}`, 'danger');
  };

  // InBody
  const openInbodyEditorNew = () => {
    setInbodyEditorEntry(null);
    setInbodyEditorOpen(true);
  };
  const openInbodyEditorEdit = (entry) => {
    setInbodyEditorEntry(entry);
    setInbodyEditorOpen(true);
  };
  const closeInbodyEditor = () => {
    setInbodyEditorOpen(false);
    setInbodyEditorEntry(null);
  };

  const applyInbodyChange = (newLogs) => {
    setInbodyLogs(newLogs);
    if (newLogs.length === 0) return;
    const sorted = [...newLogs].sort((a,b) => new Date(b.date) - new Date(a.date));
    const latest = sorted[0];
    setBaseline(prev => prev ? {
      ...prev,
      weight: latest.weight,
      fatPercent: latest.fatPercent,
      musclePercent: latest.musclePercent,
      bmr: latest.bmr,
      bmi: latest.bmi
    } : prev);
  };

  const handleSaveInbody = (entry) => {
    let newLogs;
    if (inbodyEditorEntry?.id) {
      newLogs = inbodyLogs.map(l => l.id === entry.id ? entry : l);
      showToast('✓ Замер обновлён');
    } else {
      newLogs = [...inbodyLogs, entry];
      showToast('✓ Замер добавлен');
    }
    applyInbodyChange(newLogs);
    closeInbodyEditor();
  };

  const handleDeleteInbody = (entry) => {
    const newLogs = inbodyLogs.filter(l => l.id !== entry.id);
    applyInbodyChange(newLogs);
    showToast('Замер удалён', 'danger');
  };

  if (!user) return <AuthScreen onAuth={handleAuth} onDemo={handleDemo} />;
  if (!baseline || editingBaseline) {
    return <Onboarding onComplete={handleOnboard} initial={baseline}
      onCancel={baseline ? () => setEditingBaseline(false) : null} />;
  }

  const hasAnyData = foodLogs.length > 0 || activities.length > 0;
  const goToGoal = () => { setTab('goal'); setMobileTab('goal'); };

  if (isMobile) {
    return (
      <div className="app">
        <div className="mobile-header">
          <div className="logo">Meta<span>bo</span></div>
          <div className="mobile-user">
            <div className="mobile-avatar" style={{ cursor: 'pointer' }}
              onClick={() => setMobileTab('profile')}>
              {user.charAt(0).toUpperCase()}
            </div>
            <span>{user.split('@')[0]}</span>
          </div>
        </div>
        <div className="mobile-content">
          {mobileTab==='map' && todayData && (
            <>
              <MetabolismMap baseline={baseline} todayData={todayData} sim={sim} plan={plan}
                hasAnyData={hasAnyData} goal={goal}
                foodLogs={foodLogs} activities={activities}
                onOpenLogger={openLoggerNew} onGoToGoal={goToGoal} />
              <ActivityHistory foodLogs={foodLogs} activities={activities}
                onEdit={openLoggerEdit} onDelete={handleDelete} />
            </>
          )}
          {mobileTab==='goal' && todayData && (
            <><div className="mobile-page-title">Цель</div>
              <GoalTab baseline={baseline} tdee={todayData.tdee} goal={goal} plan={plan} onSetGoal={handleSetGoal} /></>
          )}
          {mobileTab==='dishes' && (
            <DishesTab dishes={dishes} onEditDish={openDishEditor} onDeleteDish={handleDeleteDish}
              onAddDish={() => openDishEditor(null)} />
          )}
          {mobileTab==='journal' && (
            <><div className="mobile-page-title">Журнал</div>
              <Journal history={history} goal={goal} baseline={baseline} sim={sim} todayData={todayData}
                inbodyLogs={inbodyLogs} onEditInbody={openInbodyEditorEdit}
                onDeleteInbody={handleDeleteInbody} onAddInbody={openInbodyEditorNew} /></>
          )}
          {mobileTab==='profile' && (
            <MobileProfile user={user} baseline={baseline} goal={goal}
              onLogout={handleLogout} onUpdateBaseline={openInbodyEditorNew}
              onOpenHelp={() => setHelpOpen(true)} />
          )}
        </div>
        <MobileNav tab={mobileTab} onTab={setMobileTab} onAdd={openLoggerNew} />
        {loggerOpen && <ActivityLogger baseline={baseline} editingEntry={editingEntry}
          dishes={dishes} onClose={closeLogger} onSave={handleSave} />}
        {dishEditorOpen && <DishEditor dish={dishEditorDish} onSave={handleSaveDish} onClose={closeDishEditor} />}
        {inbodyEditorOpen && <InBodyEditor entry={inbodyEditorEntry} baseline={baseline}
          onSave={handleSaveInbody} onClose={closeInbodyEditor} />}
        {helpOpen && (
          <div className="modal-backdrop" onClick={() => setHelpOpen(false)}>
            <div className="modal modal-lg" onClick={e => e.stopPropagation()}>
              <div className="modal-header">
                <div className="modal-title">📖 Справка</div>
                <button className="close-btn" onClick={() => setHelpOpen(false)}>×</button>
              </div>
              <div className="modal-body"><HelpContent /></div>
            </div>
          </div>
        )}
        {toast && <div className={`toast ${toast.kind}`}>{toast.msg}</div>}
      </div>
    );
  }

  return (
    <div className="app">
      <div className="header">
        <div className="logo">Meta<span>bo</span></div>
        <div style={{ display:'flex', alignItems:'center', gap: 12 }}>
          <div className="tabs">
            <button className={`tab ${tab==='map'?'active':''}`} onClick={()=>setTab('map')}>Карта</button>
            <button className={`tab ${tab==='goal'?'active':''}`} onClick={()=>setTab('goal')}>Цель</button>
            <button className={`tab ${tab==='dishes'?'active':''}`} onClick={()=>setTab('dishes')}>Рацион</button>
            <button className={`tab ${tab==='journal'?'active':''}`} onClick={()=>setTab('journal')}>Журнал</button>
            <button className={`tab ${tab==='help'?'active':''}`} onClick={()=>setTab('help')}>📖 Справка</button>
          </div>
          <div className="mobile-avatar" style={{ cursor:'pointer' }} title={user}>
            {user.charAt(0).toUpperCase()}
          </div>
          <button className="close-btn" onClick={handleLogout} title="Выйти">⏻</button>
        </div>
      </div>
      {tab==='map' && todayData && (
        <>
          <MetabolismMap baseline={baseline} todayData={todayData} sim={sim} plan={plan}
            hasAnyData={hasAnyData} goal={goal}
            foodLogs={foodLogs} activities={activities}
            onOpenLogger={openLoggerNew} onGoToGoal={goToGoal} />
          <ActivityHistory foodLogs={foodLogs} activities={activities}
            onEdit={openLoggerEdit} onDelete={handleDelete} />
        </>
      )}
      {tab==='goal' && todayData && (
        <GoalTab baseline={baseline} tdee={todayData.tdee} goal={goal} plan={plan} onSetGoal={handleSetGoal} />
      )}
      {tab==='dishes' && (
        <DishesTab dishes={dishes} onEditDish={openDishEditor} onDeleteDish={handleDeleteDish}
          onAddDish={() => openDishEditor(null)} />
      )}
      {tab==='journal' && (
        <Journal history={history} goal={goal} baseline={baseline} sim={sim} todayData={todayData}
          inbodyLogs={inbodyLogs} onEditInbody={openInbodyEditorEdit}
          onDeleteInbody={handleDeleteInbody} onAddInbody={openInbodyEditorNew} />
      )}
      {tab==='help' && <HelpTab />}
      {loggerOpen && <ActivityLogger baseline={baseline} editingEntry={editingEntry}
        dishes={dishes} onClose={closeLogger} onSave={handleSave} />}
      {dishEditorOpen && <DishEditor dish={dishEditorDish} onSave={handleSaveDish} onClose={closeDishEditor} />}
      {inbodyEditorOpen && <InBodyEditor entry={inbodyEditorEntry} baseline={baseline}
        onSave={handleSaveInbody} onClose={closeInbodyEditor} />}
      {toast && <div className={`toast ${toast.kind}`}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
