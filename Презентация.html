<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Metabo — Карта метаболизма</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#080b14;--bg-2:#0f1420;--bg-3:#161c2b;--border:#1f2638;--text:#e2e8f0;--muted:#6b7280;
    --fat:#f97316;--fat-2:#ef4444;--lipo:#dc2626;--lipo-2:#991b1b;--muscle:#3b82f6;--muscle-2:#22c55e;
    --accent:#8b5cf6;--goal:#eab308; }
  html,body { height:100%; }
  body { background: radial-gradient(ellipse at top,#0f1420 0%,#080b14 50%); color: var(--text);
    min-height: 100vh; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  .app { max-width: 1200px; margin: 0 auto; padding: 20px 20px 40px; min-height: 100vh; }
  .header { display: flex; justify-content: space-between; align-items: center;
    padding: 16px 0 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { background: linear-gradient(135deg,var(--fat),var(--muscle));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tabs { display: flex; gap: 4px; background: var(--bg-2); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
  .tab { padding: 8px 14px; border-radius: 8px; background: transparent; border: none;
    color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .tab.active { background: var(--bg-3); color: var(--text); }
  .tab:hover:not(.active) { color: var(--text); }

  .auth { max-width: 440px; margin: 0 auto; padding: 40px 20px; min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center; }
  .auth-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 24px; padding: 36px 32px; }
  .auth-logo { font-size: 40px; font-weight: 900; text-align: center; margin-bottom: 6px; letter-spacing: -2px; }
  .auth-logo span { background: linear-gradient(135deg,var(--fat),var(--muscle));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .auth-tag { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .auth-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .auth-divider .line { flex: 1; height: 1px; background: var(--border); }
  .auth-divider .text { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .auth-switch { display: flex; gap: 4px; background: var(--bg-3); padding: 4px; border-radius: 10px; margin-bottom: 20px; }
  .auth-switch button { flex: 1; padding: 10px; border: none; background: transparent;
    color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; border-radius: 8px; font-family: inherit; }
  .auth-switch button.active { background: var(--bg-2); color: var(--text); }
  .auth-error { background: rgba(249,115,22,0.12); color: var(--fat); border: 1px solid rgba(249,115,22,0.4);
    padding: 12px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
  .auth-note { font-size: 11px; color: var(--muted); margin-top: 16px; text-align: center; line-height: 1.5; }

  .onboarding { max-width: 560px; margin: 60px auto; padding: 40px;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 24px; }
  .onboarding h1 { font-size: 32px; margin-bottom: 8px; letter-spacing: -1px; }
  .onboarding p { color: var(--muted); margin-bottom: 32px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .field input, .field select { background: var(--bg-3); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 10px; font-size: 15px; width: 100%; transition: border-color 0.2s; font-family: inherit; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field.full { grid-column: 1 / -1; }
  .btn { background: linear-gradient(135deg,var(--accent),#6366f1); color: white; border: none;
    padding: 14px 24px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%;
    transition: transform 0.15s, box-shadow 0.2s; font-family: inherit; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 25px rgba(139,92,246,0.3); }
  .btn:active { transform: translateY(0); }
  .btn.secondary { background: var(--bg-3); color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:hover { box-shadow: none; background: #1d2436; }
  .btn.goal { background: linear-gradient(135deg,var(--goal),#f59e0b); color: #080b14; }
  .btn.goal:hover { box-shadow: 0 10px 25px rgba(234,179,8,0.3); }
  .btn.danger { background: rgba(249,115,22,0.1); color: var(--fat); border: 1px solid rgba(249,115,22,0.3); }
  .btn.danger:hover { background: rgba(249,115,22,0.15); box-shadow: none; }

  .map-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
  .map-panel { background: linear-gradient(180deg,#0d1220 0%,#080b14 100%);
    border: 1px solid var(--border); border-radius: 24px; padding: 24px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .map-panel::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%,rgba(139,92,246,0.1) 0%,transparent 60%); pointer-events: none; }
  .body3d-container { position: relative; width: 100%; height: 380px;
    display: flex; justify-content: center; align-items: center; }
  .body3d-container canvas { display: block; cursor: grab; touch-action: none; }
  .body3d-container canvas:active { cursor: grabbing; }
  .floating-delta { position: absolute; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700;
    white-space: nowrap; background: rgba(15,20,32,0.9); border: 1px solid; backdrop-filter: blur(8px); z-index: 5; pointer-events: none; }
  .delta-fat-good { color: var(--muscle-2); border-color: rgba(34,197,94,0.5); }
  .delta-fat-bad { color: var(--lipo); border-color: rgba(220,38,38,0.5); }
  .delta-muscle { color: var(--muscle); border-color: rgba(59,130,246,0.4); }
  @keyframes floatUp { 0%{transform:translateY(0);opacity:0.85;} 100%{transform:translateY(-6px);opacity:0.6;} }
  .drag-hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
    font-size: 10px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.6; pointer-events: none; }

  .processes { width: 100%; margin-top: 16px; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 2; }
  .process-card { background: rgba(15,20,32,0.85); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .process-card-header { display: flex; justify-content: space-between; align-items: center; }
  .process-card-title { display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
  .process-card-icon { font-size: 16px; }
  .process-help-btn { width: 18px; height: 18px; border-radius: 50%;
    background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.4);
    color: var(--accent); font-size: 11px; font-weight: 900; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1;
    padding: 0; font-family: inherit; transition: all 0.15s; margin-left: 2px; }
  .process-help-btn:hover { background: rgba(139,92,246,0.3); color: var(--text); }
  .process-rate-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .process-card-rate { display: flex; align-items: baseline; gap: 6px; }
  .rate-value { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1; }
  .rate-unit { font-size: 12px; color: var(--muted); font-weight: 600; }
  .process-status { margin-left: auto; font-size: 11px; font-weight: 700; }
  .process-card-today { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .process-card-today strong { color: var(--text); font-weight: 700; }
  .process-card-plan { font-weight: 600; }
  .process-card-expected { font-size: 11px; color: var(--muted); line-height: 1.4; }
  .process-context { font-size: 11px; color: var(--muted); padding-top: 8px;
    border-top: 1px dashed var(--border); display: flex; align-items: center; gap: 6px; }
  .process-context-icon { font-size: 12px; opacity: 0.7; }

  .process-breakdown { background: rgba(0,0,0,0.25); border-radius: 8px;
    padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; font-size: 11px; }
  .breakdown-row { display: flex; justify-content: space-between; align-items: baseline; }
  .breakdown-row span { color: var(--muted); }
  .breakdown-row strong { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 12px; }
  .breakdown-row.total { border-top: 1px dashed var(--border); padding-top: 4px; margin-top: 2px; }
  .breakdown-row.total span { color: var(--text); font-weight: 600; }

  .process-detail { font-size: 11px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .process-detail span { white-space: nowrap; }
  .process-detail strong { color: var(--text); font-weight: 700; }

  .process-timer { font-size: 11px; font-weight: 700; color: var(--lipo);
    font-variant-numeric: tabular-nums; letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 4px; }
  .process-timer-icon { display: inline-block; animation: spin 2s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .sparkline-wrapper { display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; background: rgba(0,0,0,0.2); border-radius: 8px; }
  .sparkline-wrapper svg { display: block; }
  .sparkline-label { font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.4px; font-weight: 700; white-space: nowrap; }

  .process-help-popup { background: rgba(139,92,246,0.06); border: 1px solid rgba(139,92,246,0.2);
    border-radius: 10px; padding: 12px 14px; font-size: 12px; line-height: 1.55; color: var(--muted);
    animation: slideDown 0.2s ease-out; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .process-help-popup h4 { font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 6px; }
  .process-help-popup h4.good { color: var(--muscle-2); }
  .process-help-popup h4.bad { color: var(--lipo); }
  .process-help-popup h4.synth { color: var(--muscle-2); }
  .process-help-popup h4.catab { color: var(--fat); }
  .process-help-popup ul { margin: 0 0 10px 16px; padding: 0; }
  .process-help-popup ul:last-child { margin-bottom: 0; }
  .process-help-popup li { margin-bottom: 3px; font-size: 12px; }
  .process-help-popup strong { color: var(--text); }

  .bar-track { height: 8px; background: var(--bg-3); border-radius: 4px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    position: relative; overflow: hidden; }
  .bar-fill.good { background: linear-gradient(90deg,var(--muscle),var(--muscle-2)); }
  .bar-fill.bad { background: linear-gradient(90deg,var(--lipo-2),var(--lipo)); }
  .bar-fill.neutral { background: var(--muted); }
  .bar-fill::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent); animation: shimmer 2s infinite; }
  @keyframes shimmer { 0%{transform:translateX(-100%);} 100%{transform:translateX(100%);} }

  .stats-panel { display: flex; flex-direction: column; gap: 12px; }
  .stat-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; }
  .stat-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .stat-value.fat { color: var(--fat); }
  .stat-value.muscle { color: var(--muscle); }
  .stat-value.negative { color: var(--fat); }
  .stat-value.positive { color: var(--muscle-2); }
  .stat-unit { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }

  .macro-row { margin-bottom: 12px; }
  .macro-row:last-child { margin-bottom: 0; }
  .macro-row-header { display: flex; justify-content: space-between; font-size: 12px;
    margin-bottom: 5px; align-items: baseline; }
  .macro-row-label { color: var(--muted); font-weight: 600; }
  .macro-row-value strong { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .macro-row-plan { color: var(--muted); font-weight: 500; }

  .goal-section { background: var(--bg-2); border: 1px solid var(--border); border-radius: 20px; padding: 24px; }
  .goal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .goal-title { font-size: 18px; font-weight: 800; }
  .goal-title span { color: var(--goal); }
  .goal-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
  .goal-result { margin-top: 20px; padding: 20px; border-radius: 16px; border: 1px solid; display: flex; flex-direction: column; gap: 12px; }
  .goal-result.feasible { border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.05); }
  .goal-result.infeasible { border-color: rgba(249,115,22,0.3); background: rgba(249,115,22,0.05); }
  .goal-verdict { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .verdict-icon { width: 28px; height: 28px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .verdict-icon.ok { background: rgba(34,197,94,0.15); color: var(--muscle-2); }
  .verdict-icon.warn { background: rgba(249,115,22,0.15); color: var(--fat); }
  .goal-details { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 12px; }
  .goal-detail { background: rgba(0,0,0,0.2); padding: 10px 14px; border-radius: 10px; }
  .goal-detail-label { font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px; font-weight: 700; margin-bottom: 4px; }
  .goal-detail-value { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .goal-detail-value.goal-color { color: var(--goal); }
  .goal-detail-value.ok { color: var(--muscle-2); }
  .goal-detail-value.warn { color: var(--fat); }
  .goal-warning { font-size: 12px; color: var(--fat); line-height: 1.5;
    padding: 10px 14px; background: rgba(249,115,22,0.08); border-radius: 10px; }

  .history-list { margin-top: 24px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 20px; padding: 20px 24px; }
  .history-list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .history-list-title { font-size: 14px; font-weight: 700; }
  .history-list-title span { color: var(--muted); font-weight: 500; }
  .history-list-count { background: var(--bg-3); color: var(--muted); padding: 3px 10px;
    border-radius: 20px; font-size: 12px; font-weight: 700; }
  .history-day { border-bottom: 1px solid var(--border); }
  .history-day:last-child { border-bottom: none; }
  .history-day-header { display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 14px 0; background: transparent; border: none;
    color: var(--text); cursor: pointer; font-family: inherit; text-align: left;
    transition: opacity 0.15s; }
  .history-day-header:hover { opacity: 0.8; }
  .history-day-chevron { display: inline-block; transition: transform 0.2s;
    color: var(--muted); font-size: 14px; width: 12px; margin-right: 4px; }
  .history-day-chevron.open { transform: rotate(90deg); }
  .history-day-body { padding-bottom: 12px; }
  .history-day-title { font-weight: 700; font-size: 14px; }
  .history-day-count { color: var(--muted); font-size: 12px; margin-left: 8px; font-weight: 500; }
  .history-day-summary { font-size: 11px; color: var(--muted); }

  .entry-group { margin-top: 14px; }
  .entry-group-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  .entry-row { display: flex; justify-content: space-between; align-items: center;
    padding: 11px 0; border-bottom: 1px solid var(--border); transition: background 0.15s,padding 0.15s; border-radius: 8px; }
  .entry-row:hover { background: rgba(255,255,255,0.02); padding-left: 8px; padding-right: 8px; }
  .entry-row:last-child { border-bottom: none; }
  .entry-info { flex: 1; min-width: 0; }
  .entry-label { font-size: 14px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-meta { font-size: 12px; color: var(--muted); }
  .entry-meta strong { color: var(--text); font-weight: 600; }
  .entry-actions { display: flex; gap: 6px; margin-left: 12px; }
  .entry-actions button { background: var(--bg-3); border: 1px solid var(--border); color: var(--muted);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-family: inherit; flex-shrink: 0; }
  .entry-actions button:hover { color: var(--text); border-color: var(--accent); background: #1d2436; }
  .entry-actions button.danger:hover { color: var(--fat); border-color: var(--fat); }

  .dishes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .dish-card { background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px; transition: background 0.15s; }
  .dish-card:hover { background: rgba(255,255,255,0.02); }
  .dish-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .dish-name { font-size: 15px; font-weight: 700; flex: 1; line-height: 1.3; word-break: break-word; }
  .dish-macros { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 12px; }
  .dish-macro { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); }
  .dish-macro strong { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .dish-macro.cal { grid-column: 1 / -1; border-bottom: 1px dashed var(--border); padding-bottom: 6px; margin-bottom: 2px; }
  .dish-macro.cal strong { color: var(--accent); font-size: 14px; }

  .empty-dishes { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-dishes h3 { color: var(--text); font-size: 18px; margin-bottom: 8px; }

  /* Dish picker in food logger */
  .dish-picker-list { display: flex; flex-direction: column; gap: 6px;
    max-height: 320px; overflow-y: auto; margin-bottom: 16px;
    padding-right: 4px; }
  .dish-pick-item { background: var(--bg-3); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; text-align: left;
    color: var(--text); cursor: pointer; font-family: inherit;
    transition: all 0.15s; }
  .dish-pick-item:hover { background: #1d2436; border-color: var(--accent); }
  .dish-pick-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .dish-pick-macros { font-size: 11px; color: var(--muted); }

  /* Journal sub-tabs */
  .subtabs { display: flex; gap: 4px; background: var(--bg-2); padding: 4px;
    border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px;
    width: fit-content; }
  .subtab { padding: 8px 18px; border-radius: 8px; background: transparent; border: none;
    color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; font-family: inherit; }
  .subtab.active { background: var(--bg-3); color: var(--text); }
  .subtab:hover:not(.active) { color: var(--text); }

  /* InBody cards */
  .inbody-card { background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 20px; }
  .inbody-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .inbody-date { font-size: 15px; font-weight: 700; }
  .inbody-date-full { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .inbody-current-badge { display: inline-block; background: rgba(234,179,8,0.15); color: var(--goal);
    padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px; margin-left: 8px; }
  .inbody-values { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .inbody-value-box { background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 8px; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

// ============================================================
// МАТЕМАТИКА
// ============================================================
function calculateBMR(w, h, a, g) {
  if (!w || !h || !a) return 0;
  const b = 10*w + 6.25*h - 5*a;
  return g==='male' ? b+5 : b-161;
}
function calculateTEF(p, c, f) { return p*4*0.3 + c*4*0.1 + f*9*0.03; }
const ACTIVITY_COEFFICIENTS = { sedentary:1.2, light:1.375, moderate:1.55, high:1.725, extreme:1.9 };
function calculateTDEE(bmr, level, workoutCal, m) {
  const c = ACTIVITY_COEFFICIENTS[level] || 1.375;
  return bmr * c + calculateTEF(m.protein||0, m.carbs||0, m.fat||0) + workoutCal;
}
const MET_COEFFICIENTS = { volleyball:4.0, padel:6.0, tennis:7.0, football:7.0, basketball:6.5 };
function calcMETCalories(met, w, min) { return Math.round(met * w * (min/60)); }
function formatSigned(n, d=0) { return (n>=0?'+':'−') + Math.abs(n).toFixed(d); }
const genId = () => Math.random().toString(36).slice(2, 10);
function calcBMI(weight, heightCm) {
  if (!weight || !heightCm) return 0;
  return +(weight / Math.pow(heightCm / 100, 2)).toFixed(1);
}

function formatTimer(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function plural(n, forms) {
  if (n % 10 === 1 && n % 100 !== 11) return forms[0];
  if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return forms[1];
  return forms[2];
}

function formatDayLabel(date) {
  const now = new Date();
  const today = new Date(now); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
  const d = new Date(date); d.setHours(0,0,0,0);
  if (d.getTime() === today.getTime()) return 'Сегодня';
  if (d.getTime() === yesterday.getTime()) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
}

// ============================================================
// NUMBER INPUT
// ============================================================
function NumberInput({ value, onChange, placeholder, className, style, ...rest }) {
  const [raw, setRaw] = useState(() => {
    if (value === '' || value == null) return '';
    return String(value).replace('.', ',');
  });
  useEffect(() => {
    const normalized = raw.replace(',', '.');
    const parsed = normalized === '' ? '' : parseFloat(normalized);
    const parsedIsInvalid = Number.isNaN(parsed);
    if (parsed !== value && !(parsedIsInvalid && (value === '' || value == null))) {
      setRaw(value === '' || value == null ? '' : String(value).replace('.', ','));
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [value]);
  const handleChange = (e) => {
    const v = e.target.value;
    if (v !== '' && !/^-?\d*([.,]\d*)?$/.test(v)) return;
    setRaw(v);
    if (v === '' || v === '-' || v === '.' || v === ',' || v === '-.' || v === '-,') {
      if (v === '') onChange('');
      return;
    }
    const num = parseFloat(v.replace(',', '.'));
    if (!Number.isNaN(num)) onChange(num);
  };
  return (
    <input type="text" inputMode="decimal" value={raw} onChange={handleChange}
      placeholder={placeholder} className={className} style={style} {...rest} />
  );
}

// ============================================================
// МОДЕЛЬ
// ============================================================
function computeHourlyRate(hour, dayStartTs, foodLogs, activities, calorieBalance) {
  const isSleepingHour = hour >= 23 || hour < 7;
  const baseFat = 0.22;
  let insulinSuppression = 1.0;
  let insulinSignal = 0;

  for (const meal of foodLogs) {
    const hoursSince = hour - (meal.timestamp - dayStartTs) / 3600e3;
    if (hoursSince < 0 || hoursSince > 5) continue;
    const suppStrength = Math.min(0.9, 0.3 + (meal.carbs || 0) * 0.012 + (meal.calories || 0) / 2500);
    const decay = 1 - hoursSince / 5;
    insulinSuppression *= (1 - suppStrength * decay);
    const peak = hoursSince < 1 ? hoursSince : Math.max(0, 1 - (hoursSince - 1) / 4);
    const mealLoad = ((meal.carbs || 0) * 0.02 + (meal.fat || 0) * 0.03
                    + (meal.protein || 0) * 0.015 + (meal.calories || 0) / 1000);
    insulinSignal += mealLoad * peak;
  }

  const circadian = 0.6 + 0.55 * Math.cos((hour - 4) / 24 * 2 * Math.PI);
  let sleepBoost = isSleepingHour ? 1.4 : 1.0;
  for (const s of activities.filter(a => a.type === 'sleep')) {
    const startHour = (s.timestamp - dayStartTs) / 3600e3;
    const endHour = startHour + (s.hours || 8);
    if (hour >= startHour && hour <= endHour) sleepBoost = Math.max(sleepBoost, 1.45);
  }
  let exerciseBoost = 0;
  for (const w of activities.filter(a => a.type === 'workout')) {
    const hoursSince = hour - (w.timestamp - dayStartTs) / 3600e3;
    if (hoursSince < 0) continue;
    const cardioFactor = w.subtype === 'cardio' ? 1.0 : 0.35;
    const intensity = Math.min(1, (w.calories || 300) / 500);
    exerciseBoost += cardioFactor * intensity * Math.exp(-hoursSince / 2) * 0.9;
  }
  let deficitFactor;
  if (calorieBalance < 0) deficitFactor = 1 + Math.min(1.0, Math.abs(calorieBalance) / 600);
  else deficitFactor = Math.max(0.35, 1 - calorieBalance / 1200);
  const lipolysis = Math.max(0.01,
    (baseFat + exerciseBoost) * insulinSuppression * circadian * sleepBoost * deficitFactor);

  const baseEsterif = 0.10;
  const insulinDriven = insulinSignal * 3.5;
  const surplusFactor = calorieBalance > 0 ? Math.min(2.0, calorieBalance / 500) : 0;
  const dnl = surplusFactor * 0.4;
  const esterification = baseEsterif * (1 + insulinDriven) * (1 + surplusFactor) + dnl;
  const netFatFlux = lipolysis - esterification;

  const baseMps = 0.03;
  let mealMps = 0;
  for (const meal of foodLogs) {
    if ((meal.protein || 0) < 15) continue;
    const hoursSince = hour - (meal.timestamp - dayStartTs) / 3600e3;
    if (hoursSince < 0 || hoursSince > 3.5) continue;
    const intensity = Math.min(1, (meal.protein || 0) / 35);
    mealMps += intensity * 2.0 * (1 - hoursSince / 3.5);
  }
  let trainingBoost = 1.0;
  for (const w of activities.filter(a => a.type === 'workout' && a.subtype === 'strength')) {
    const hoursSince = hour - (w.timestamp - dayStartTs) / 3600e3;
    if (hoursSince < 0 || hoursSince > 36) continue;
    trainingBoost = Math.max(trainingBoost, 0.7 + 1.5 * Math.exp(-hoursSince / 10));
  }
  const sleepFactor = isSleepingHour ? 0.15 : 1.0;
  const energyFactor = calorieBalance < 0 ? 0.5 : 1.0;
  const mps = (baseMps + mealMps) * trainingBoost * sleepFactor * energyFactor;
  let mpb = 0.06;
  if (isSleepingHour) mpb = 0.13;
  let lastMealHour = -Infinity;
  for (const meal of foodLogs) {
    const mh = (meal.timestamp - dayStartTs) / 3600e3;
    if (mh <= hour && mh > lastMealHour) lastMealHour = mh;
  }
  const fastingHours = lastMealHour > -Infinity ? hour - lastMealHour : hour;
  if (fastingHours > 5) mpb *= 1.25;
  if (fastingHours > 9) mpb *= 1.15;
  const netMuscle = mps - mpb;

  return { lipolysis, esterification, netFatFlux, netMuscle };
}

function simulateDay(foodLogs, activities, calorieBalance) {
  const now = new Date();
  const dayStart = new Date(now); dayStart.setHours(0,0,0,0);
  const dayStartTs = dayStart.getTime();
  const currentHour = (now - dayStartTs) / 3600e3;
  const step = 0.25;
  let netFatToday = 0, fatOxidized = 0, fatStored = 0, muscleToday = 0;
  const snapshots = [];
  for (let h = 0; h <= currentHour + 1e-9; h += step) {
    const hh = Math.min(h, currentHour);
    const r = computeHourlyRate(hh, dayStartTs, foodLogs, activities, calorieBalance);
    snapshots.push({ hour: hh, ...r });
    if (snapshots.length > 1) {
      const prev = snapshots[snapshots.length - 2];
      const dh = hh - prev.hour;
      if (dh > 0) {
        netFatToday += (r.netFatFlux + prev.netFatFlux) / 2 * dh;
        fatOxidized += (r.lipolysis + prev.lipolysis) / 2 * dh;
        fatStored += (r.esterification + prev.esterification) / 2 * dh;
        muscleToday += (r.netMuscle + prev.netMuscle) / 2 * dh;
      }
    }
  }
  const current = snapshots[snapshots.length - 1] || {
    lipolysis: 0, esterification: 0, netFatFlux: 0, netMuscle: 0
  };
  return {
    currentLipolysis: current.lipolysis,
    currentEsterification: current.esterification,
    currentNetFatFlux: current.netFatFlux,
    currentMuscle: current.netMuscle,
    netFatToday, fatOxidized, fatStored, muscleToday,
    currentHour, snapshots
  };
}

function computePlan(goal, baseline) {
  if (!goal || !goal.assessment) return null;
  const days = Math.max(1, goal.assessment.daysAvailable);
  let fatPerDay = 0, musclePerDay = 0;
  if (goal.targetType === 'weight') {
    const dW = goal.targetValue - baseline.weight;
    if (dW < 0) fatPerDay = -dW * 1000 * 0.85 / days;
    else musclePerDay = dW * 1000 * 0.5 / days;
  } else if (goal.targetType === 'fatPercent') {
    const leanKg = baseline.weight * (1 - baseline.fatPercent / 100);
    const currFat = baseline.weight * baseline.fatPercent / 100;
    const targetFat = (goal.targetValue / 100) * leanKg / (1 - goal.targetValue / 100);
    fatPerDay = Math.max(0, (currFat - targetFat) * 1000 / days);
  } else if (goal.targetType === 'musclePercent') {
    const fatKg = baseline.weight * baseline.fatPercent / 100;
    const currMuscle = baseline.weight * baseline.musclePercent / 100;
    const targetMuscle = (goal.targetValue / 100) * fatKg / (1 - goal.targetValue / 100);
    musclePerDay = Math.max(0, (targetMuscle - currMuscle) * 1000 / days);
  }
  return { fatPerDay, musclePerDay, days };
}

function deriveGoalTargets(goal, baseline) {
  const cw = baseline.weight, cf = baseline.fatPercent, cm = baseline.musclePercent;
  const fatMassNow = cw * cf / 100;
  const muscleMassNow = cw * cm / 100;
  const leanMassNow = cw - fatMassNow;
  let targetWeight = cw, targetFatPct = cf, targetMusclePct = cm;
  if (goal.targetType === 'weight') {
    targetWeight = goal.targetValue;
    const dw = targetWeight - cw;
    const fatRatio = dw < 0 ? 0.75 : 0.5;
    const fatMassTarget = Math.max(0, fatMassNow + dw * fatRatio);
    const muscleMassTarget = Math.max(0, muscleMassNow + dw * (1 - fatRatio));
    targetFatPct = (fatMassTarget / targetWeight) * 100;
    targetMusclePct = (muscleMassTarget / targetWeight) * 100;
  } else if (goal.targetType === 'fatPercent') {
    targetFatPct = goal.targetValue;
    const fatMassTarget = (targetFatPct / 100) * leanMassNow / (1 - targetFatPct / 100);
    targetWeight = leanMassNow + fatMassTarget;
    targetMusclePct = (muscleMassNow / targetWeight) * 100;
  } else if (goal.targetType === 'musclePercent') {
    targetMusclePct = goal.targetValue;
    const muscleMassTarget = (targetMusclePct / 100) * cw;
    const deltaMuscle = muscleMassTarget - muscleMassNow;
    const fatMassTarget = Math.max(0, fatMassNow - deltaMuscle);
    targetWeight = cw;
    targetFatPct = (fatMassTarget / cw) * 100;
  }
  return { weight: targetWeight, fatPercent: targetFatPct, musclePercent: targetMusclePct };
}

function computePlanSeries(history, goal, baseline, field) {
  if (!goal || !goal.assessment) return null;
  const targets = deriveGoalTargets(goal, baseline);
  const startValue = baseline[field];
  const endValue = targets[field];
  if (startValue == null || endValue == null) return null;
  const startTime = goal.createdAt ? new Date(goal.createdAt).getTime() : Date.now();
  const endTime = new Date(goal.targetDate).getTime();
  const totalDuration = endTime - startTime;
  if (totalDuration <= 0) return null;
  return history.map(d => {
    const t = new Date(d.date).getTime();
    if (t < startTime) return null;
    const progress = Math.min(1, (t - startTime) / totalDuration);
    return startValue + (endValue - startValue) * progress;
  });
}

function getContextText(foodLogs, activities, now) {
  const ts = now.getTime();
  const hour = now.getHours() + now.getMinutes()/60;
  const isSleeping = hour >= 23 || hour < 7;
  const lastMeal = foodLogs.filter(m => m.timestamp <= ts).sort((a,b) => b.timestamp - a.timestamp)[0];
  const lastWorkout = activities.filter(a => a.type === 'workout' && a.timestamp <= ts)
    .sort((a,b) => b.timestamp - a.timestamp)[0];
  const parts = [];
  if (isSleeping) parts.push('🌙 Сон (голодание)');
  if (lastWorkout) {
    const hrs = (ts - lastWorkout.timestamp) / 3600e3;
    if (hrs < 3) parts.push(`🏋️ Тренировка ${hrs.toFixed(1)}ч назад`);
  }
  if (lastMeal) {
    const hrs = (ts - lastMeal.timestamp) / 3600e3;
    if (hrs < 2.5) parts.push(`🍽 Приём пищи ${hrs.toFixed(1)}ч назад`);
    else if (hrs > 6 && !isSleeping) parts.push(`⏱ Голод ${hrs.toFixed(0)}ч`);
  }
  return parts.join(' · ') || '⚪ В покое';
}

// ============================================================
function assessGoal({ targetType, targetValue, targetDate, baseline, tdee }) {
  const now = new Date(), end = new Date(targetDate);
  const days = Math.max(1, Math.ceil((end-now)/86400000));
  const weeks = days/7, months = days/30.4, cw = baseline.weight;
  let cur, delta, unit;
  if (targetType==='weight') { cur=cw; delta=targetValue-cw; unit='кг'; }
  else if (targetType==='fatPercent') { cur=baseline.fatPercent; delta=targetValue-baseline.fatPercent; unit='%'; }
  else { cur=baseline.musclePercent; delta=targetValue-baseline.musclePercent; unit='%'; }
  const dir = delta<0?'loss':delta>0?'gain':'maintain';
  let weekly, monthly, feasible, verdict, limitDesc;
  if (targetType==='weight'||targetType==='fatPercent') {
    const fatKg = Math.abs(targetType==='fatPercent' ? (targetValue-baseline.fatPercent)/100*cw : delta);
    weekly = fatKg/weeks; monthly = fatKg/months;
    const maxPct = cw*0.01, maxAbs = 1.0, maxF = Math.min(maxPct, maxAbs);
    feasible = weekly <= maxF + 0.05;
    limitDesc = `Максимум ~${maxF.toFixed(2)} кг жира/нед (${(maxPct/cw*100).toFixed(1)}% массы тела)`;
    verdict = feasible
      ? `Реалистично: ${weekly.toFixed(2)} кг/нед — в безопасном диапазоне (0.5–1% массы тела)`
      : `Слишком агрессивно: ${weekly.toFixed(2)} кг/нед против предела ~${maxF.toFixed(2)} кг/нед`;
  } else {
    const mKg = Math.abs((targetValue-baseline.musclePercent)/100*cw);
    monthly = mKg/months; weekly = mKg/weeks;
    const maxM = cw*0.015;
    feasible = monthly <= maxM*1.05;
    limitDesc = `Максимум ~${maxM.toFixed(2)} кг мышц/мес (1.5% массы тела)`;
    verdict = feasible
      ? `Реалистично: ${monthly.toFixed(2)} кг/мес — в пределах возможного`
      : `Слишком агрессивно: ${monthly.toFixed(2)} кг/мес, новички редко превышают ${maxM.toFixed(2)} кг/мес`;
  }
  let dAdj = 0;
  if (dir==='loss') {
    dAdj = -(weekly*7700)/7;
    dAdj = Math.max(-tdee*0.25, Math.min(-tdee*0.15, dAdj));
    if (!feasible) dAdj = -tdee*0.25;
  } else if (dir==='gain' && targetType==='musclePercent') dAdj = feasible ? 200 : 300;
  let realDate = end;
  if (!feasible) {
    const ratePerDay = (targetType==='weight'||targetType==='fatPercent')
      ? Math.min(cw*0.01, 1.0)/7 : (cw*0.015)/30.4;
    const deltaKg = Math.abs(targetType==='fatPercent' ? (targetValue-baseline.fatPercent)/100*cw
      : targetType==='musclePercent' ? (targetValue-baseline.musclePercent)/100*cw : delta);
    realDate = new Date(now.getTime() + Math.ceil(deltaKg/ratePerDay)*86400000);
  }
  const tCal = Math.round(tdee + dAdj);
  const ppk = dir==='loss' ? 2.0 : 1.8;
  const tProt = Math.round(cw*ppk);
  const tFat = Math.round((tCal*0.25)/9);
  const tCarb = Math.max(0, Math.round((tCal - tProt*4 - tFat*9)/4));
  return { isFeasible: feasible, verdict, direction: dir, targetType, targetValue, targetUnit: unit,
    currentValue: cur, targetDelta: delta, dailyCalorieAdjustment: Math.round(dAdj),
    targetCalories: tCal, targetProtein: tProt, targetFat: tFat, targetCarbs: tCarb,
    weeklyRateNeeded: weekly, monthlyRateNeeded: monthly, limitDescription: limitDesc,
    realisticDate: !feasible ? realDate : end, daysAvailable: days, originalDate: end };
}

function AuthScreen({ onAuth, onDemo }) {
  const [mode, setMode] = useState('login');
  const [error, setError] = useState('');
  const emailRef = useRef(null);
  const passwordRef = useRef(null);
  const doAuth = () => {
    setError('');
    const email = (emailRef.current?.value || '').trim();
    const password = passwordRef.current?.value || '';
    if (!email || !password) { setError('Заполните оба поля'); return; }
    if (!email.includes('@')) { setError('Введите корректный email'); return; }
    if (password.length < 4) { setError('Пароль минимум 4 символа'); return; }
    try {
      const users = JSON.parse(localStorage.getItem('metabo_users') || '{}');
      if (mode === 'register') {
        if (users[email]) { setError('Пользователь уже существует. Переключитесь на «Вход».'); return; }
        users[email] = { password, createdAt: Date.now() };
        localStorage.setItem('metabo_users', JSON.stringify(users));
      } else {
        if (!users[email]) { setError('Пользователь не найден. Переключитесь на «Регистрация».'); return; }
        if (users[email].password !== password) { setError('Неверный пароль'); return; }
      }
      try { localStorage.setItem('metabo_session', email); } catch (e) {}
      onAuth(email);
    } catch (err) { setError('Ошибка хранилища: ' + err.message); }
  };
  return (
    <div className="auth">
      <div className="auth-card">
        <div className="auth-logo">Meta<span>bo</span></div>
        <div className="auth-tag">Метаболизм в реальном времени</div>

          Без регистрации · сразу с примерами данных

        <div className="auth-divider">
          <div className="line" /><span className="text">или через аккаунт</span><div className="line" />
        </div>
        <div className="auth-switch">
          <button type="button" className={mode==='login'?'active':''}
            onClick={() => { setMode('login'); setError(''); }}>Вход</button>
          <button type="button" className={mode==='register'?'active':''}
            onClick={() => { setMode('register'); setError(''); }}>Регистрация</button>
        </div>
        <form onSubmit={(e) => { e.preventDefault(); doAuth(); }}>
          {error && <div className="auth-error">⚠ {error}</div>}
          <div className="form-grid" style={{ gridTemplateColumns: '1fr', gap: 12 }}>
            <div className="field"><label>Email</label>

        </form>

      </div>
    </div>
  );
}

function Body3D({ fatIntensity, muscleIntensity, lipogenesisIntensity, netFatToday, muscleToday }) {
  const mountRef = useRef(null);
  const refs = useRef({
    target:{fat:0,muscle:0,lipo:0}, current:{fat:0,muscle:0,lipo:0},
    rotation:0, mouseDown:false, lastX:0
  });
  const initRef = useRef(false);

  useEffect(() => {
    refs.current.target = {
      fat: fatIntensity,
      muscle: muscleIntensity,
      lipo: lipogenesisIntensity || 0
    };
  }, [fatIntensity, muscleIntensity, lipogenesisIntensity]);

  useEffect(() => {
    if (initRef.current) return;
    const el = mountRef.current;
    if (!el || !window.THREE) return;
    initRef.current = true;
    const THREE = window.THREE;
    const scene = new THREE.Scene();
    const w = el.clientWidth || 340, h = el.clientHeight || 380;
    const camera = new THREE.PerspectiveCamera(40, w/h, 0.1, 100);
    camera.position.set(0, 0.5, 7.5); camera.lookAt(0, 0.5, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h); el.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(3,5,5); scene.add(key);
    const rim = new THREE.DirectionalLight(0x8b5cf6, 1.0); rim.position.set(-4,2,-3); scene.add(rim);
    const fill = new THREE.PointLight(0x3b82f6, 0.7); fill.position.set(0,-2,4); scene.add(fill);

    function makeBody(material) {
      const g = new THREE.Group();
      const add = (geo, pos, scale) => {
        const m = new THREE.Mesh(geo, material);
        m.position.set(...pos); if (scale) m.scale.set(...scale); g.add(m);
      };
      add(new THREE.SphereGeometry(0.32, 32, 32), [0, 2.35, 0]);
      add(new THREE.CapsuleGeometry(0.13, 0.15, 8, 16), [0, 2.0, 0]);
      add(new THREE.SphereGeometry(0.62, 32, 32), [0, 1.15, 0], [1, 1.55, 0.72]);
      add(new THREE.SphereGeometry(0.24, 20, 20), [-0.68, 1.65, 0]);
      add(new THREE.SphereGeometry(0.24, 20, 20), [0.68, 1.65, 0]);
      add(new THREE.CapsuleGeometry(0.17, 0.55, 8, 16), [-0.82, 1.2, 0]);
      add(new THREE.CapsuleGeometry(0.17, 0.55, 8, 16), [0.82, 1.2, 0]);
      add(new THREE.CapsuleGeometry(0.14, 0.55, 8, 16), [-0.87, 0.55, 0]);
      add(new THREE.CapsuleGeometry(0.14, 0.55, 8, 16), [0.87, 0.55, 0]);
      add(new THREE.SphereGeometry(0.5, 24, 24), [0, 0.35, 0], [1.15, 0.75, 0.85]);
      add(new THREE.CapsuleGeometry(0.21, 0.6, 8, 16), [-0.28, -0.35, 0]);
      add(new THREE.CapsuleGeometry(0.21, 0.6, 8, 16), [0.28, -0.35, 0]);
      add(new THREE.CapsuleGeometry(0.17, 0.6, 8, 16), [-0.28, -1.15, 0]);
      add(new THREE.CapsuleGeometry(0.17, 0.6, 8, 16), [0.28, -1.15, 0]);
      add(new THREE.BoxGeometry(0.26, 0.14, 0.45), [-0.28, -1.7, 0.1]);
      add(new THREE.BoxGeometry(0.26, 0.14, 0.45), [0.28, -1.7, 0.1]);
      return g;
    }

    const bodyGroup = new THREE.Group();
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x2a3449, roughness: 0.55, metalness: 0.35 });
    bodyGroup.add(makeBody(baseMat));
    const fatMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false });
    const fatBody = makeBody(fatMat); fatBody.scale.setScalar(1.025); bodyGroup.add(fatBody);
    const lipoMat = new THREE.MeshBasicMaterial({ color: 0xdc2626, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false });
    const lipoBody = makeBody(lipoMat); lipoBody.scale.setScalar(1.04); bodyGroup.add(lipoBody);
    const muscleMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false });
    const muscleBody = makeBody(muscleMat); muscleBody.scale.setScalar(1.055); bodyGroup.add(muscleBody);
    bodyGroup.position.y = 0.3; scene.add(bodyGroup);

    let t = 0, animId;
    const animate = () => {
      animId = requestAnimationFrame(animate); t += 0.016;
      const r = refs.current;
      r.current.fat += (r.target.fat - r.current.fat) * 0.08;
      r.current.muscle += (r.target.muscle - r.current.muscle) * 0.08;
      r.current.lipo += (r.target.lipo - r.current.lipo) * 0.08;
      fatMat.opacity = r.current.fat * (0.55 + 0.45 * Math.sin(t * 2.2)) * 0.7;
      muscleMat.opacity = r.current.muscle * (0.55 + 0.45 * Math.sin(t * 2.6 + 1)) * 0.7;
      lipoMat.opacity = r.current.lipo * (0.55 + 0.45 * Math.sin(t * 1.8 + 2)) * 0.7;
      if (!r.mouseDown) r.rotation += 0.003;
      bodyGroup.rotation.y = r.rotation;
      renderer.render(scene, camera);
    };
    animate();

    const onDown = (e) => { refs.current.mouseDown = true; refs.current.lastX = e.clientX; };
    const onMove = (e) => { if (!refs.current.mouseDown) return;
      refs.current.rotation += (e.clientX - refs.current.lastX) * 0.01; refs.current.lastX = e.clientX; };
    const onUp = () => { refs.current.mouseDown = false; };
    const onTS = (e) => { refs.current.mouseDown = true; refs.current.lastX = e.touches[0].clientX; };
    const onTM = (e) => { if (!refs.current.mouseDown) return;
      refs.current.rotation += (e.touches[0].clientX - refs.current.lastX) * 0.015; refs.current.lastX = e.touches[0].clientX; };
    const onTE = () => { refs.current.mouseDown = false; };
    const onResize = () => {
      const nw = el.clientWidth, nh = el.clientHeight;
      if (!nw || !nh) return;
      renderer.setSize(nw, nh); camera.aspect = nw/nh; camera.updateProjectionMatrix();
    };
    renderer.domElement.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    renderer.domElement.addEventListener('touchstart', onTS, { passive: true });
    window.addEventListener('touchmove', onTM, { passive: true });
    window.addEventListener('touchend', onTE);
    window.addEventListener('resize', onResize);

    return () => {
      cancelAnimationFrame(animId); renderer.dispose();
      if (el.contains(renderer.domElement)) el.removeChild(renderer.domElement);
      renderer.domElement.removeEventListener('mousedown', onDown);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      renderer.domElement.removeEventListener('touchstart', onTS);
      window.removeEventListener('touchmove', onTM);
      window.removeEventListener('touchend', onTE);
      window.removeEventListener('resize', onResize);
    };
  }, []);

  const showFatBurn = netFatToday != null && netFatToday > 0.5;
  const showFatGain = netFatToday != null && netFatToday < -0.5;

  return (
    <div className="body3d-container">
      <div ref={mountRef} style={{ width:'100%', height:'100%' }} />
      {showFatBurn && (
        <div className="floating-delta delta-fat-good" style={{ top:'24%', left:'6%', animation:'floatUp 2s ease-in-out infinite alternate' }}>
          ↓ {Math.round(Math.abs(netFatToday))}г жира
        </div>
      )}
      {showFatGain && (
        <div className="floating-delta delta-fat-bad" style={{ top:'30%', left:'6%', animation:'floatUp 2.2s ease-in-out infinite alternate' }}>
          ↑ {Math.round(Math.abs(netFatToday))}г накоплено
        </div>
      )}
      {muscleToday > 0.3 && (
        <div className="floating-delta delta-muscle" style={{ top:'58%', right:'6%', animation:'floatUp 2.4s ease-in-out infinite alternate' }}>
          ↑ {Math.round(muscleToday)}г мышц
        </div>
      )}
      <div className="drag-hint">⟲ потяни, чтобы повернуть</div>
    </div>
  );
}

function MiniSparkline({ data, color = 'var(--fat)', width = 100, height = 28 }) {
  if (!data || data.length < 2) return null;
  const values = data.map(d => d.value);
  const min = Math.min(...values, 0);
  const max = Math.max(...values, 0);
  const range = max - min || 1;
  const pts = data.map((d, i) => ({
    x: (i / (data.length - 1)) * width,
    y: height - ((d.value - min) / range) * height
  }));
  const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const zeroY = height - ((0 - min) / range) * height;
  return (
    <svg width={width} height={height} style={{ display: 'block', overflow: 'visible' }}>
      {min < 0 && max > 0 && (
        <line x1="0" y1={zeroY} x2={width} y2={zeroY}
          stroke="var(--border)" strokeWidth="1" strokeDasharray="2 2" />
      )}
      <path d={path} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={pts[pts.length - 1].x} cy={pts[pts.length - 1].y} r="2" fill={color} />
    </svg>
  );
}

function ProcessCard({

  });

  useEffect(() => {
    const id = setInterval(() => {
      const now = new Date();
      setSecondsToNextHour(3600 - ((now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds()) % 3600));
    }, 1000);
    return () => clearInterval(id);
  }, []);

  const isFat = color === 'fat';

      rateBadge = { label: '▲ накопление', color: 'var(--lipo)' }; 
    } else { 
      rateColor = 'var(--lipo-2)'; 
      rateBadge = { label: '▲▲ хранение', color: 'var(--lipo-2)' }; 
    }
    barClass = isGood ? 'good' : isBad ? 'bad' : 'neutral';
  } else {
    if (currentDisplayRate > 0.2) { 
      rateColor = 'var(--muscle-2)'; 
      rateBadge = { label: '▲ синтез', color: 'var(--muscle-2)' }; 
    } else if (currentDisplayRate > 0) { 
      rateColor = 'var(--muscle)'; 
      rateBadge = { label: '● баланс', color: 'var(--muscle)' }; 
    } else { 
      rateColor = 'var(--fat)'; 
      rateBadge = { label: '▼ катаболизм', color: 'var(--fat)' }; 
    }
    barClass = isGood ? 'good' : isBad ? 'bad' : 'neutral';
  }

  let status = null;
  let progressPct = 0;
  let expectedDisplay = 0;
  if (hasPlan) {
    const planProgress = Math.abs(todayDisplayValue) / Math.abs(planDisplayValue);
    const timeProgress = currentHour / 24;
    const diff = planProgress - timeProgress;
    if (todayDisplayValue * planDisplayValue < 0) {
      status = { label: '⏱ отставание', color: 'var(--fat)' };
    } else if (diff > 0.05) {
      status = { label: '✓ опережение', color: 'var(--muscle-2)' };
    } else if (diff < -0.05) {
      status = { label: '⏱ отставание', color: 'var(--fat)' };
    } else {
      status = { label: '● в графике', color: 'var(--goal)' };
    }
    progressPct = Math.min(120, planProgress * 100);
    expectedDisplay = planDisplayValue * timeProgress;
  }

  const displayRate = (currentDisplayRate >= 0 ? '+' : '−') + Math.abs(currentDisplayRate).toFixed(2);
  const todayAbs = Math.abs(todayDisplayValue);
  let todayLabel;
  if (isFat) {
    todayLabel = todayDisplayValue < 0 ? 'сожжено' : todayDisplayValue > 0 ? 'накоплено' : 'баланс';
  } else {
    todayLabel = todayDisplayValue > 0 ? 'синтез' : todayDisplayValue < 0 ? 'распад' : 'баланс';
  }
  const planDisplayStr = hasPlan 
    ? `${planDisplayValue > 0 ? '+' : '−'}${Math.abs(planDisplayValue).toFixed(0)} г/день`
    : null;

  return (
    <div className="process-card">
      <div className="process-card-header">
        <div className="process-card-title">
          <span className="process-card-icon">{icon}</span>
          <span style={{ color: rateColor }}>{title}</span>
          {helpContent && (
            <button className="process-help-btn" onClick={() => setShowHelp(s => !s)}
              title="Что влияет на баланс?" aria-label="Справка">
              {showHelp ? '×' : '?'}
            </button>
          )}
        </div>
        <span className="process-rate-badge" style={{ color: rateBadge.color }}>{rateBadge.label}</span>
      </div>

      {showHelp && helpContent && (
        <div className="process-help-popup">{helpContent}</div>
      )}

      <div className="process-card-rate">
        <span className="rate-value" style={{ color: rateColor }}>{displayRate}</span>
        <span className="rate-unit">г/ч</span>
        {status && <span className="process-status" style={{ color: status.color }}>{status.label}</span>}
      </div>

      {isFat && lipolysisRate != null && esterificationRate != null && (
        <div className="process-breakdown">
          <div className="breakdown-row">
            <span>🟢 сжигается</span>
            <strong style={{ color: 'var(--muscle-2)' }}>−{lipolysisRate.toFixed(2)} г/ч</strong>
          </div>
          <div className="breakdown-row">
            <span>🔴 откладывается</span>
            <strong style={{ color: 'var(--lipo)' }}>+{esterificationRate.toFixed(2)} г/ч</strong>
          </div>
          <div className="breakdown-row total">
            <span>= чистый поток</span>
            <strong style={{ color: rateColor }}>{displayRate} г/ч</strong>
          </div>
        </div>
      )}

      <div className="process-timer">
        <span className="process-timer-icon">⟳</span>
        <span>след. обновление через {formatTimer(secondsToNextHour)}</span>
      </div>

      <div className="process-card-today">
        <span>{todayLabel}: <strong>{todayAbs.toFixed(1)}</strong> г</span>
        {hasPlan && <span className="process-card-plan">План: {planDisplayStr}</span>}
      </div>

      {hasPlan && (
        <>
          <div className="bar-track">
            <div className={`bar-fill ${barClass}`} style={{ width: `${Math.min(100, Math.max(0, progressPct))}%` }} />
          </div>
          <div className="process-card-expected">
            Ожидалось: {expectedDisplay.toFixed(1)} г · {((currentHour/24)*100).toFixed(0)}% дня
          </div>
        </>
      )}

      {fatDetail && <div className="process-detail">{fatDetail}</div>}

      {sparklineData && sparklineData.length > 1 && (
        <div className="sparkline-wrapper">
          <MiniSparkline data={sparklineData} color={rateColor} width={100} height={28} />
          <span className="sparkline-label">6 часов</span>
        </div>
      )}

      <div className="process-context">
        <span className="process-context-icon">📍</span>
        <span>{context}</span>
      </div>
    </div>
  );
}

function MacroRow({ label, current, planned, color, unit='г' }) {
  const pct = planned > 0 ? Math.min(100, (current / planned) * 100) : 0;
  return (
    <div className="macro-row">
      <div className="macro-row-header">
        <span className="macro-row-label">{label}</span>
        <span className="macro-row-value">
          <strong>{Math.round(current || 0)}</strong>
          {planned > 0 && <span className="macro-row-plan"> / {planned}{unit}</span>}
          {planned > 0 && <span className="macro-row-plan"> ({Math.round(pct)}%)</span>}
        </span>
      </div>
      {planned > 0 && (
        <div className="bar-track" style={{ height: 5 }}>
          <div className="bar-fill good" style={{ width: `${pct}%`, height: '100%' }} />
        </div>
      )}
    </div>
  );
}

function MetabolismMap({ baseline, todayData, sim, plan, hasAnyData, goal,
  foodLogs, activities, onOpenLogger, onGoToGoal }) {
  const { tdee, caloriesConsumed, balance, macros, sleepHours, hasStrength } = todayData;
  const context = sim ? getContextText(foodLogs, activities, new Date()) : 'Загрузка...';
  const targetPlan = goal?.assessment || null;
  const plannedBalance = targetPlan ? targetPlan.dailyCalorieAdjustment : null;

  const fatIntensity = sim && sim.currentNetFatFlux > 0
    ? Math.min(0.9, sim.currentNetFatFlux / 1.0) : 0;
  const lipoIntensity = sim && sim.currentNetFatFlux < 0
    ? Math.min(0.9, -sim.currentNetFatFlux / 3.0) : 0;
  const muscleIntensity = sim && sim.currentMuscle > 0
    ? Math.min(0.9, sim.currentMuscle / 0.5) : 0;

  const fatDisplayRate = sim ? -sim.currentNetFatFlux : 0;
  const fatDisplayToday = sim ? -sim.netFatToday : 0;
  const fatPlanDisplay = plan?.fatPerDay ? -plan.fatPerDay : 0;

  const muscleDisplayRate = sim ? sim.currentMuscle : 0;
  const muscleDisplayToday = sim ? sim.muscleToday : 0;
  const musclePlanDisplay = plan?.musclePerDay || 0;

  const sparklineFat = sim ? sim.snapshots.slice(-24).map(s => ({
    hour: s.hour, value: -s.netFatFlux
  })) : null;
  const sparklineMuscle = sim ? sim.snapshots.slice(-24).map(s => ({
    hour: s.hour, value: s.netMuscle
  })) : null;

  const fatDetail = sim ? (
    <>
      <span>🔥 окислено сегодня: <strong>{sim.fatOxidized.toFixed(1)}</strong> г</span>
      <span>🔴 отложено сегодня: <strong>{sim.fatStored.toFixed(1)}</strong> г</span>
    </>
  ) : null;

  return (
    <div className="map-layout">
      <div className="map-panel">
        <Body3D fatIntensity={fatIntensity}
          muscleIntensity={muscleIntensity}
          lipogenesisIntensity={lipoIntensity}
          netFatToday={hasAnyData && sim ? sim.netFatToday : 0}
          muscleToday={hasAnyData && sim ? sim.muscleToday : 0} />
        {hasAnyData && sim ? (
          <div className="processes">
            <ProcessCard 
              title="Жир · баланс" icon="🔥" color="fat"
              currentDisplayRate={fatDisplayRate}
              todayDisplayValue={fatDisplayToday}
              planDisplayValue={fatPlanDisplay}
              currentHour={sim.currentHour}
              context={context}
              sparklineData={sparklineFat}
              helpContent={FAT_HELP}
              lipolysisRate={sim.currentLipolysis}
              esterificationRate={sim.currentEsterification}
              fatDetail={fatDetail}
            />
            <ProcessCard 
              title="Синтез мышц" icon="💪" color="muscle"
              currentDisplayRate={muscleDisplayRate}
              todayDisplayValue={muscleDisplayToday}
              planDisplayValue={musclePlanDisplay}
              currentHour={sim.currentHour}
              context={context}
              sparklineData={sparklineMuscle}
              helpContent={MUSCLE_HELP}
            />
          </div>
        ) : (
          <div style={{ marginTop: 20, textAlign:'center', color:'var(--muted)', fontSize: 13, maxWidth: 280, position:'relative', zIndex: 2 }}>
            Добавь еду и тренировки, чтобы увидеть прогноз
          </div>
        )}
      </div>

      <div className="stats-panel">
        <div className="stat-card">
          <div className="stat-label">Энергобаланс</div>
          <div className={`stat-value ${balance<0?'negative':balance>0?'positive':''}`}>
            {formatSigned(balance, 0)}<span className="stat-unit">ккал</span>
          </div>
          <div className="stat-sub">
            {balance<0?'Дефицит':balance>0?'Профицит':'Поддержание'} ·
            Потреблено {Math.round(caloriesConsumed)} / TDEE {Math.round(tdee)}
          </div>
          {plannedBalance != null && (
            <div className="stat-sub" style={{ borderTop:'1px dashed var(--border)', paddingTop: 8, marginTop: 8 }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: 4 }}>
                <span>🎯 План ({targetPlan.direction === 'loss' ? 'дефицит' : targetPlan.direction === 'gain' ? 'профицит' : 'поддерж.'}):</span>
                <strong style={{ color: 'var(--goal)', fontVariantNumeric:'tabular-nums' }}>
                  {formatSigned(plannedBalance, 0)} ккал
                </strong>
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <span>Норма калорий:</span>
                <strong style={{ color: 'var(--text)', fontVariantNumeric:'tabular-nums' }}>
                  {targetPlan.targetCalories} ккал
                </strong>
              </div>
            </div>
          )}
        </div>

        <div className="stat-card">
          <div className="stat-label">КБЖУ сегодня {targetPlan && <span style={{ color: 'var(--goal)' }}>· план</span>}</div>
          <MacroRow label="Калории" current={caloriesConsumed}
            planned={targetPlan ? targetPlan.targetCalories : 0}
            color="linear-gradient(90deg,var(--accent),#6366f1)" unit=" ккал" />
          <MacroRow label="Белки" current={macros.protein}
            planned={targetPlan ? targetPlan.targetProtein : 0}
            color="linear-gradient(90deg,var(--muscle),var(--muscle-2))" />
          <MacroRow label="Жиры" current={macros.fat}
            planned={targetPlan ? targetPlan.targetFat : 0}
            color="linear-gradient(90deg,var(--fat),var(--fat-2))" />
          <MacroRow label="Углеводы" current={macros.carbs}
            planned={targetPlan ? targetPlan.targetCarbs : 0}
            color="linear-gradient(90deg,var(--goal),#f59e0b)" />
        </div>

        <div className="stat-card">
          <div className="stat-label">Сон</div>
          <div className="stat-value">{(sleepHours||0).toFixed(1)}<span className="stat-unit">ч</span></div>
          <div className="stat-sub">
            {sleepHours>=7?'✓ Достаточно':'⚠ Меньше 7ч'} ·
            {hasStrength?' силовая была':' без силовой'}
          </div>
        </div>

        {!goal && <button className="btn goal" onClick={onGoToGoal}>🎯 Поставить цель</button>}
        <button className="btn" onClick={onOpenLogger}>+ Добавить активность</button>
      </div>
    </div>
  );
}

function GoalTab({ baseline, tdee, goal, plan, onSetGoal }) {
  const [targetType, setTargetType] = useState(goal?.targetType || 'weight');
  const [targetValue, setTargetValue] = useState(goal?.targetValue || 72);
  const [targetDate, setTargetDate] = useState(() => {
    if (goal?.targetDate) return goal.targetDate.slice(0, 10);
    const d = new Date(); d.setMonth(d.getMonth()+3); return d.toISOString().slice(0, 10);
  });
  const assessment = useMemo(() => {
    if (targetValue === '' || !targetDate) return null;
    return assessGoal({ targetType, targetValue: +targetValue, targetDate, baseline, tdee });
  }, [targetType, targetValue, targetDate, baseline, tdee]);
  const handleSave = () => {
    if (!assessment) return;
    onSetGoal({ targetType, targetValue: +targetValue, targetDate, assessment, createdAt: new Date().toISOString() });
  };
  return (
    <div>
      <div className="goal-section">
        <div className="goal-header">
          <div className="goal-title">🎯 <span>Цель</span></div>
          {goal && <div style={{ fontSize: 12, color: 'var(--muted)' }}>
            {goal.targetValue}{goal.assessment?.targetUnit} к {new Date(goal.targetDate).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'})}
          </div>}
        </div>
        <div className="goal-grid">
          <div className="field"><label>Параметр</label>
            <select value={targetType} onChange={e => setTargetType(e.target.value)}>
              <option value="weight">Вес (кг)</option>
              <option value="fatPercent">% жира</option>
              <option value="musclePercent">% мышц</option>
            </select></div>
          <div className="field"><label>Значение ({targetType==='weight'?'кг':'%'})</label>
            <NumberInput value={targetValue} onChange={v => setTargetValue(v)} /></div>
          <div className="field"><label>К дате</label>
            <input type="date" value={targetDate} onChange={e => setTargetDate(e.target.value)} /></div>
          <button className="btn goal" onClick={handleSave} style={{ width:'auto', padding:'14px 24px' }}>Рассчитать</button>
        </div>
        {assessment && (
          <div className={`goal-result ${assessment.isFeasible?'feasible':'infeasible'}`}>
            <div className="goal-verdict">
              <div className={`verdict-icon ${assessment.isFeasible?'ok':'warn'}`}>{assessment.isFeasible?'✓':'!'}</div>
              <span style={{ color: assessment.isFeasible?'var(--muscle-2)':'var(--fat)' }}>
                {assessment.isFeasible?'Реалистично':'Слишком агрессивно'}
              </span>
            </div>
            <div style={{ fontSize: 13, lineHeight: 1.6, color: 'var(--muted)' }}>{assessment.verdict}</div>
            <div className="goal-details">
              <div className="goal-detail"><div className="goal-detail-label">Сейчас</div>
                <div className="goal-detail-value">{assessment.currentValue.toFixed(1)}{assessment.targetUnit}</div></div>
              <div className="goal-detail"><div className="goal-detail-label">Цель</div>
                <div className="goal-detail-value goal-color">{assessment.targetValue}{assessment.targetUnit}</div></div>
              <div className="goal-detail"><div className="goal-detail-label">Дневной {assessment.direction==='loss'?'дефицит':'профицит'}</div>
                <div className={`goal-detail-value ${assessment.isFeasible?'ok':'warn'}`}>
                  {assessment.dailyCalorieAdjustment>0?'+':''}{assessment.dailyCalorieAdjustment} ккал</div></div>
              <div className="goal-detail"><div className="goal-detail-label">Реалистичная дата</div>
                <div className="goal-detail-value">
                  {assessment.realisticDate.toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'})}</div></div>
            </div>
            {!assessment.isFeasible && (
              <div className="goal-warning">
                ⚠ {assessment.limitDescription}. Сдвиньте дату на{' '}
                <strong>{assessment.realisticDate.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</strong>{' '}
                или менее амбициозную цель.
              </div>
            )}
            <div style={{ borderTop:'1px solid var(--border)', paddingTop: 14, marginTop: 4 }}>
              <div className="stat-label" style={{ marginBottom: 10 }}>Дневные цели по КБЖУ</div>
              <div className="goal-details">
                <div className="goal-detail"><div className="goal-detail-label">Калории</div>
                  <div className="goal-detail-value goal-color">{assessment.targetCalories} ккал</div></div>
                <div className="goal-detail"><div className="goal-detail-label">Белки</div>
                  <div className="goal-detail-value">{assessment.targetProtein} г</div></div>
                <div className="goal-detail"><div className="goal-detail-label">Жиры</div>
                  <div className="goal-detail-value">{assessment.targetFat} г</div></div>
                <div className="goal-detail"><div className="goal-detail-label">Углеводы</div>
                  <div className="goal-detail-value">{assessment.targetCarbs} г</div></div>
              </div>
            </div>
            {plan && (plan.fatPerDay > 0 || plan.musclePerDay > 0) && (
              <div style={{ borderTop:'1px solid var(--border)', paddingTop: 14, marginTop: 4 }}>
                <div className="stat-label" style={{ marginBottom: 10 }}>Дневные планы по составу тела</div>
                <div className="goal-details">
                  {plan.fatPerDay > 0 && (
                    <div className="goal-detail"><div className="goal-detail-label">Сжигание жира</div>
                      <div className="goal-detail-value" style={{ color: 'var(--muscle-2)' }}>−{plan.fatPerDay.toFixed(0)} г/день</div></div>
                  )}
                  {plan.musclePerDay > 0 && (
                    <div className="goal-detail"><div className="goal-detail-label">Синтез мышц</div>
                      <div className="goal-detail-value" style={{ color: 'var(--muscle)' }}>+{plan.musclePerDay.toFixed(1)} г/день</div></div>
                  )}
                  <div className="goal-detail"><div className="goal-detail-label">Дней до цели</div>
                    <div className="goal-detail-value">{assessment.daysAvailable}</div></div>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function DishEditor({ dish, onSave, onClose }) {
  const isEdit = !!dish?.id;
  const [form, setForm] = useState(dish || { name: '', calories: 0, protein: 0, fat: 0, carbs: 0 });
  const [err, setErr] = useState('');
  const update = (f, v) => setForm(prev => ({ ...prev, [f]: v }));
  const handleSubmit = () => {
    if (!form.name || !form.name.trim()) { setErr('Укажите название блюда'); return; }
    setErr('');
    const cleaned = {
      ...form,
      name: form.name.trim(),
      calories: +form.calories || 0,
      protein: +form.protein || 0,
      fat: +form.fat || 0,
      carbs: +form.carbs || 0
    };
    onSave(cleaned);
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-header">
          <div className="modal-title">{isEdit ? 'Редактировать блюдо' : 'Новое блюдо'}</div>
          <button className="close-btn" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div className="form-grid">
            <div className="field full">
              <label>Название</label>
              <input value={form.name} onChange={e => update('name', e.target.value)}

const WORKOUT_NAMES = { strength:'Силовая', cardio:'Кардио', volleyball:'Волейбол',
  padel:'Падел', tennis:'Теннис', football:'Футбол', basketball:'Баскетбол' };
const OTHER_NAMES = { walk:'Прогулка', work_sit:'Работа сидячая', work_stand:'Работа стоячая', chill:'Спокойствие' };
function entryEmoji(e) { return e.type==='food'?'🍽':e.type==='workout'?'🏋️':e.type==='sleep'?'😴':'🚶'; }
function entryLabel(e) {
  if (e.type==='food') return e.name || 'Приём пищи';
  if (e.type==='workout') return WORKOUT_NAMES[e.subtype] || 'Тренировка';
  if (e.type==='sleep') return 'Сон';
  return OTHER_NAMES[e.subtype] || 'Активность';
}
function entryMeta(e) {
  if (e.type==='food') return <><strong>{e.calories||0}</strong> ккал · Б <strong>{e.protein||0}</strong> · Ж <strong>{e.fat||0}</strong> · У <strong>{e.carbs||0}</strong></>;
  if (e.type==='workout') return <>{e.duration||0} мин · <strong>{e.calories||0}</strong> ккал</>;
  if (e.type==='sleep') return <>{e.hours||0} ч {e.quality?`· качество ${e.quality}/5`:''}</>;
  return <>{e.duration||0} мин</>;
}
function formatTime(ts) { return new Date(ts).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' }); }

const TYPE_TITLES = { food:'🍽 Питание', workout:'🏋️ Тренировки', sleep:'😴 Сон', other:'🚶 Прочая активность' };

function ActivityHistory({ foodLogs, activities, onEdit, onDelete }) {
  const [expanded, setExpanded] = useState({});

  const grouped = useMemo(() => {
    const map = {};
    [...foodLogs, ...activities].forEach(item => {
      const d = new Date(item.timestamp);
      d.setHours(0, 0, 0, 0);
      const key = d.toDateString();
      if (!map[key]) map[key] = { dateKey: key, dateObj: d, items: [] };
      map[key].items.push(item);
    });
    const arr = Object.values(map);
    arr.forEach(g => g.items.sort((a, b) => b.timestamp - a.timestamp));
    return arr.sort((a, b) => b.dateObj - a.dateObj);
  }, [foodLogs, activities]);

  const toggle = (key) => setExpanded(prev => ({ ...prev, [key]: !(prev[key] ?? (key === new Date().toDateString())) }));
  const todayKey = new Date().toDateString();

  if (grouped.length === 0) return null;
  const totalRecords = grouped.reduce((s, g) => s + g.items.length, 0);

  return (
    <div className="history-list">
      <div className="history-list-header">
        <div className="history-list-title">
          История активностей <span>· {grouped.length} {plural(grouped.length, ['день','дня','дней'])}</span>
        </div>
        <div className="history-list-count">{totalRecords} {plural(totalRecords, ['запись','записи','записей'])}</div>
      </div>
      {grouped.map(g => {
        const isToday = g.dateKey === todayKey;
        const isOpen = expanded[g.dateKey] ?? isToday;
        const byType = {
          food: g.items.filter(e => e.type === 'food'),
          workout: g.items.filter(e => e.type === 'workout'),
          sleep: g.items.filter(e => e.type === 'sleep'),
          other: g.items.filter(e => e.type === 'other')
        };
        const totalCals = byType.food.reduce((s, f) => s + (+f.calories || 0), 0);
        return (
          <div key={g.dateKey} className="history-day">
            <button className="history-day-header" onClick={() => toggle(g.dateKey)}>
              <div style={{ display:'flex', alignItems:'center', flex: 1, minWidth: 0 }}>
                <span className={`history-day-chevron ${isOpen ? 'open' : ''}`}>›</span>
                <span className="history-day-title">{isToday ? 'Сегодня' : formatDayLabel(g.dateObj)}</span>
                <span className="history-day-count">{g.items.length} {plural(g.items.length, ['запись','записи','записей'])}</span>
              </div>
              {totalCals > 0 && (
                <span className="history-day-summary">{Math.round(totalCals)} ккал</span>
              )}
            </button>
            {isOpen && (
              <div className="history-day-body">
                {['food','workout','sleep','other'].map(k => {
                  const items = byType[k];
                  if (items.length === 0) return null;
                  return (
                    <div key={k} className="entry-group">
                      <div className="entry-group-label">{TYPE_TITLES[k]}</div>
                      {items.map(entry => (
                        <div key={entry.id} className="entry-row">
                          <div className="entry-info">
                            <div className="entry-label">
                              {entryEmoji(entry)} {entryLabel(entry)}
                              <span style={{ color:'var(--muted)', fontSize: 12, fontWeight: 500, marginLeft: 8 }}>
                                {formatTime(entry.timestamp)}
                              </span>
                            </div>
                            <div className="entry-meta">{entryMeta(entry)}</div>
                          </div>
                          <div className="entry-actions">
                            <button onClick={() => onEdit(entry)} title="Редактировать">✎</button>
                            <button className="danger" onClick={() => onDelete(entry)} title="Удалить">×</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}
